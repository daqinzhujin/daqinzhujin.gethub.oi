<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <style>

        .cut-table td:first-child, .cut-table td:nth-child(2), .cut-table td:nth-child(3), .cut-table th:first-child, .cut-table th:nth-child(2), .cut-table th:nth-child(3) { text-align:left; }
        .cut-table tr:last-child td { border-bottom:none; }
        .opening-row, .beam-row, .wall-row, .column-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; background: white; padding: 8px; border-radius: 8px; flex-wrap: wrap; border: 1px solid #e2e8f0; }

        .beam-header, .opening-header, .wall-header, .column-header { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; font-size: 0.7rem; color: #64748b; font-weight: 600; padding: 0 4px; }
        .beam-header span, .opening-header span, .wall-header span, .column-header span { text-align: center; }
        .btn-small { background: #dc2626; border: none; border-radius: 6px; padding: 6px 12px; color: white; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }

            .table-wrap { overflow:visible; border:1px solid #cbd5e1; }

        @media (max-width: 800px) {
            .grid-2, .grid-3, .grid-4, .result-summary-grid, .result-grid, .metric-grid { grid-template-columns: 1fr; }
            .container { padding: 16px; }
            body { font-size: 16px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="page-head">
        <h1>模块房综合计算器</h1>
        <div class="subtitle">按平面图录入墙段、洞口、梁、构造柱和顶板参数，自动生成模块用量、混凝土用量和钢筋下料单。</div>
        <div class="workflow">
            <span>1. 设置单价和下料参数</span>
            <span>2. 录入楼层图纸参数</span>
            <span>3. 查看汇总并打印下料单</span>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <span class="section-title">1. 单价与钢筋下料设置</span>
            <button class="btn-clear" id="clearMaterialPrice">清空单价</button>
        </div>
        <div class="grid-2">
            <div class="input-group"><label>25模块单价 (元/㎡)</label><input type="number" id="priceModule25" value="55" step="1"></div>
            <div class="input-group"><label>32模块单价 (元/㎡)</label><input type="number" id="priceModule32" value="65" step="1"></div>
            <div class="input-group"><label>25洞口插板单价 (元/块)</label><input type="number" id="priceInsert25" value="10"></div>
            <div class="input-group"><label>32洞口插板单价 (元/块)</label><input type="number" id="priceInsert32" value="10"></div>
            <div class="input-group"><label>钢丝勾单价 (元/个)</label><input type="number" id="priceHook" value="0.5" step="0.1"></div>
            <div class="input-group"><label>混凝土单价 (元/m³)</label><input type="number" id="priceConcrete" value="500" step="10"></div>
        </div>
        <div class="section-title" style="margin-top:12px;">钢筋单价</div>
        <div class="grid-2">
            <div class="input-group"><label>统一钢筋单价 (元/吨)</label><input type="number" id="priceRebar" step="10" value="3000"></div>
        </div>
        <div class="section-title" style="margin-top:12px;">钢筋下料参数</div>
        <div class="note-box">下料单为预算和现场复核用的估算表。采购量按规则分开：Φ10及以下按米数购买，Φ12及以上按整根购买。实际下料还需要按施工图、设计说明、抗震构造和现场搭接位置复核。</div>
        <div class="grid-3">
            <div class="input-group"><label>Φ12及以上整根长度 (m)</label><input type="number" id="cutStockLen" step="0.1" value="9"></div>
            <div class="input-group"><label>损耗率 (%)</label><input type="number" id="cutWasteRate" step="0.5" value="3"></div>
            <div class="input-group"><label>墙筋端部弯头/锚固 (d/端)</label><input type="number" id="cutWallHookD" step="1" value="12"></div>
            <div class="input-group"><label>梁/柱主筋弯头/锚固 (d/端)</label><input type="number" id="cutMainHookD" step="1" value="12"></div>
            <div class="input-group"><label>板筋端部弯头/锚固 (d/端)</label><input type="number" id="cutRoofHookD" step="1" value="10"></div>
            <div class="input-group"><label>箍筋弯钩 (d/端)</label><input type="number" id="cutStirrupHookD" step="1" value="10"></div>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <span class="section-title">2. 楼层图纸参数</span>
            <span>
                <button class="btn-clear" id="clearFloor1">清空一层</button>
                <button class="btn-clear" id="clearFloor2" style="margin-left:8px;">清空二层</button>
            </span>
        </div>
        <div class="floor-tabs" id="floorTabs">
            <button class="floor-tab active" data-floor="1">一层</button>
            <button class="floor-tab" data-floor="2">二层</button>
        </div>
        <div id="floor1Panel" class="floor-panel active-panel"></div>
        <div id="floor2Panel" class="floor-panel"></div>
    </div>

    <div class="result-card" id="results">
        <div class="result-title">3. 计算结果</div>
        <div class="result-actions">
            <button class="btn-clear" id="exportMaterialCsv">导出材料汇总CSV</button>
            <button class="btn-clear" id="exportRebarCsv">导出钢筋下料CSV</button>
            <button class="btn-clear" id="printRebarPdf">打印钢筋下料单/另存PDF</button>
            <button class="btn-clear" id="printResults">打印全部结果</button>
        </div>
        <div id="resultContent">输入参数后自动计算</div>
    </div>
    <div class="subnote">* 数据自动保存 · 钢筋按吨计价 · 墙体长度按中线</div>
</div>

<script>
    (function() {
        const MODULE_HEIGHT = 0.3;
        const AREA_90 = 0.27;
        const AREA_60 = 0.18;
        const MODULE_AREA = {
            '25': { 大角:0.36, 小角:0.18, 大T:0.4125, 小T:0.3225 },
            '32': { 大角:0.456, 小角:0.276, 大T:0.402,  小T:0.312 }
        };
        const cavityVolume = {
            '25': {
                '90直板': 0.9*0.14*0.3, '60直板': 0.6*0.14*0.3,
                '大角': 1.2*0.14*0.3, '小角': 0.605*0.14*0.3,
                '大T': 1.375*0.14*0.3, '小T': 1.08*0.14*0.3
            },
            '32': {
                '90直板': 0.9*0.21*0.3, '60直板': 0.6*0.21*0.3,
                '大角': 1.2*0.21*0.3, '小角': 0.6*0.21*0.3,
                '大T': 1.2*0.21*0.3+0.14*0.14*0.3, '小T': 0.6*0.21*0.3+0.44*0.14*0.3
            }
        };
        const CONNECTOR_COUNT = {
            '25': {
                '90直板': { p25:6, p32:0 }, '60直板': { p25:4, p32:0 },
                '大角': { p25:8, p32:0 }, '小角': { p25:4, p32:0 },
                '大T': { p25:10, p32:0 }, '小T': { p25:8, p32:0 }
            },
            '32': {
                '90直板': { p25:0, p32:6 }, '60直板': { p25:0, p32:4 },
                '大角': { p25:0, p32:8 }, '小角': { p25:0, p32:4 },
                '大T': { p25:2, p32:8 }, '小T': { p25:4, p32:4 }
            }
        };
        const theoreticalKgPerM = (d) => 0.00617 * d * d;
        const defaultBeamConfig = { len:3, wid:0.24, hgt:0.5, mainDia:22, mainCount:3, secDia:18, secCount:2, stirrupDia:6, stirrupSpacing:200 };
        const defaultWallConfig = { name:'墙段1', type:'32', dir:'hor', len:'3', count:1, corners:0, tWalls:0 };
        const defaultColumnConfig = { name:'Z1', count:1, height:'', width:250, depth:250, mainDia:12, mainCount:4, stirrupDia:6, stirrupSpacing:200 };

        const defaultFloorData = {
            1: { mode: 'all25', openings: [], beams: [], walls: [], columns: [], height: 3.6, wallCount: 6,
                  extHor: '', extVer: '', extCorners: 0, extTWalls: 0, intHor: '', intVer: '', intCorners: 0, intTWalls: 0,
                  wallVertDia: 12, wallHorizDia: 10,
                  colCount: 6, colMainDia: 12, colMainCount: 4, colStirrupDia: 6, colStirrupSpacing: 200, colWidth: 250, colHeight: 250,
                  roofLengthExpr: '10', roofWidthExpr: '8', roofThick: 0.12, roofDeduct: false, roofBottomDia: 12, roofTopDia: 10, roofSpacing: 200,
                  insulAreaExpr: '0', insulUnitArea: 0.732, insulThick: 50, insulPrice: 330 },
            2: { mode: 'mixed', openings: [], beams: [], walls: [], columns: [], height: 3.3, wallCount: 6,
                  extHor: '', extVer: '', extCorners: 5, extTWalls: 0, intHor: '', intVer: '', intCorners: 0, intTWalls: 4,
                  wallVertDia: 12, wallHorizDia: 10,
                  colCount: 5, colMainDia: 12, colMainCount: 4, colStirrupDia: 6, colStirrupSpacing: 200, colWidth: 250, colHeight: 250,
                  roofLengthExpr: '8', roofWidthExpr: '6', roofThick: 0.12, roofDeduct: false, roofBottomDia: 12, roofTopDia: 10, roofSpacing: 200,
                  insulAreaExpr: '0', insulUnitArea: 0.732, insulThick: 50, insulPrice: 330 }
        };
        const floorData = JSON.parse(JSON.stringify(defaultFloorData));
        const STORAGE_KEY = 'houseCalcV42_extT';
        const $ = id => document.getElementById(id);
        const priceInputs = {
            module25: $('priceModule25'), module32: $('priceModule32'),
            insert25: $('priceInsert25'), insert32: $('priceInsert32'),
            hook: $('priceHook'), concrete: $('priceConcrete'),
            rebar: $('priceRebar')
        };
        let latestResult = { materialRows: [], rebarRows: [], rebarPrintHtml: '' };

        function safeEval(e) {
            if (!e || typeof e !== 'string') return 0;
            const t = e.replace(/\s/g,'');
            if (/^[0-9+\-*/().]+$/.test(t)) { try { return eval(t); } catch { return 0; } }
            return parseFloat(e) || 0;
        }
        function emptyParts() { return { p25:0, p32:0 }; }
        function addParts(base, add, count=1) {
            base.p25 += (add.p25||0) * count;
            base.p32 += (add.p32||0) * count;
            return base;
        }
        function calcConnectors(type, counts) {
            const cfg = CONNECTOR_COUNT[type], parts = emptyParts();
            addParts(parts, cfg['90直板'], counts.c90);
            addParts(parts, cfg['60直板'], counts.c60);
            addParts(parts, cfg['大角'], counts.big);
            addParts(parts, cfg['小角'], counts.small);
            addParts(parts, cfg['大T'], counts.bigT);
            addParts(parts, cfg['小T'], counts.smallT);
            return parts;
        }
        function splitWallRuns(totalRuns, extTL, intTL) {
            const runs = Math.max(1, Number(totalRuns)||1);
            if (extTL <= 0) return { ext:0, int:runs };
            if (intTL <= 0) return { ext:runs, int:0 };
            let ext = Math.round(runs * extTL / (extTL + intTL));
            ext = Math.min(runs - 1, Math.max(1, ext));
            return { ext, int:runs - ext };
        }
        function resolveOpeningWallType(mode, op, extTL, intTL) {
            if (mode === 'all25' || extTL <= 0) return '25';
            if (intTL <= 0) return '32';
            if (op.wallType === '25' || op.wallType === '32') return op.wallType;
            return 'auto';
        }
        function calcStraightBlocks(area, wallRuns, layers) {
            if (area <= 0) return { c90:0, c60:0, area:0 };
            const min60 = Math.ceil(Math.max(1, wallRuns) * layers / 2);
            let c60 = min60, rem = area - c60 * AREA_60;
            if (rem < 0) rem = 0;
            let c90 = Math.floor(rem / AREA_90), rem2 = rem - c90 * AREA_90;
            if (rem2 > 1e-6) c60 += Math.ceil(rem2 / AREA_60);
            return { c90, c60, area:c90*AREA_90 + c60*AREA_60 };
        }
        function calcPlanWalls(d) {
            const out = { extHor:0, extVer:0, intHor:0, intVer:0, extRuns:0, intRuns:0, totalRuns:0, extCorners:0, intCorners:0, extTWalls:0, intTWalls:0, has:false, hasNodes:false };
            (d.walls||[]).forEach(w => {
                const len = safeEval(w.len) * (parseInt(w.count)||0);
                if (len <= 0) return;
                const type = d.mode === 'all25' ? '25' : (w.type === '32' ? '32' : '25');
                const dir = w.dir === 'ver' ? 'ver' : 'hor';
                const count = parseInt(w.count)||1;
                const corners = Math.max(0, parseInt(w.corners)||0);
                const tWalls = Math.max(0, parseInt(w.tWalls)||0);
                if (type === '32') {
                    if (dir === 'ver') out.extVer += len; else out.extHor += len;
                    out.extRuns += count;
                    out.extCorners += corners;
                    out.extTWalls += tWalls;
                } else {
                    if (dir === 'ver') out.intVer += len; else out.intHor += len;
                    out.intRuns += count;
                    out.intCorners += corners;
                    out.intTWalls += tWalls;
                }
                out.totalRuns += count;
                if (corners > 0 || tWalls > 0) out.hasNodes = true;
                out.has = true;
            });
            return out;

                res.concreteVolume += concreteVolume;
                if (idx===0) { res.mainDia=s.mainDia; res.stirrupDia=s.stirrupDia; }
                res.items.push({ ...s, stirrupCount:s.count*sCnt, stirrupPerColumn:sCnt, concreteVolume });
            });
            return res;
        }

        function calcRoofRebar(len, wid, bd, td, sp) {
            if (len<=0||wid<=0) return { lenBottom:0, lenTop:0, bottomDia:bd, topDia:td, spacing:sp };
            const sm = sp/1000;
            const barsLen = Math.ceil(wid/sm)+1;
            const barsWid = Math.ceil(len/sm)+1;
            const lenBottom = barsLen*len + barsWid*wid;
            const lenTop = barsLen*len + barsWid*wid;
            return { lenBottom, lenTop, bottomDia:bd, topDia:td, spacing:sp, barsLen, barsWid, len, wid };
        }

        function calcSingleBeamRebar(b) {
            if (b.len<=0) return { mainLen:0, secLen:0, stirrupLen:0, mainDia:b.mainDia||22, secDia:b.secDia||18, stirrupDia:b.stirrupDia||6, stirrupCount:0 };
            const cnt = Math.ceil(b.len/((b.stirrupSpacing||200)/1000))+1;
            const mainLen = b.len*(b.mainCount||3);
            const secLen = b.len*(b.secCount||2);
            const stirrupLen = cnt*(2*((b.wid||0.24)+(b.hgt||0.5))+0.2);
            return { mainLen, secLen, stirrupLen, mainDia:b.mainDia||22, secDia:b.secDia||18, stirrupDia:b.stirrupDia||6, stirrupCount:cnt };
        }

        function ton(d, len) { return len*theoreticalKgPerM(d)/1000; }

        function getCutParams() {
            const val = (id, fallback) => {
                const el = $(id);
                const n = el ? parseFloat(el.value) : fallback;
                return Number.isFinite(n) ? n : fallback;
            };
            return {
                stockLen: Math.max(0, val('cutStockLen', 9)),
                wasteRate: Math.max(0, val('cutWasteRate', 3)),
                wallHookD: Math.max(0, val('cutWallHookD', 12)),
                mainHookD: Math.max(0, val('cutMainHookD', 12)),
                roofHookD: Math.max(0, val('cutRoofHookD', 10)),
                stirrupHookD: Math.max(0, val('cutStirrupHookD', 10))
            };
        }

        function hookLen(dia, multiple, ends=2) {
            return dia * multiple * ends / 1000;
        }

        function isMeterPurchase(dia) {
            return dia <= 10;
        }

        function purchaseRuleText(dia, params) {
            if (isMeterPurchase(dia)) return 'Φ10及以下按实际米数采购';
            return `Φ12及以上按${params.stockLen.toFixed(1)}m/根采购`;
        }

        function purchaseText(dia, len, stockCount, params) {
            if (isMeterPurchase(dia)) return `${len.toFixed(2)}m`;
            return `${stockCount} 根 × ${params.stockLen.toFixed(1)}m`;
        }

        function addCutItem(rows, params, item) {
            const count = Math.ceil(Number(item.count)||0);
            const dia = Number(item.dia)||0;
            const baseLen = Number(item.baseLen)||0;
            if (count <= 0 || dia <= 0 || baseLen <= 0) return null;
            const addLen = Math.max(0, Number(item.addLen)||0);
            const unitLen = baseLen + addLen;
            const totalLen = unitLen * count;
            const withWasteLen = totalLen * (1 + params.wasteRate/100);
            const weight = ton(dia, withWasteLen);
            const stockCount = (!isMeterPurchase(dia) && params.stockLen > 0) ? Math.ceil(withWasteLen / params.stockLen) : 0;
            const row = {
                floor:item.floor, part:item.part, name:item.name, dia, count,
                baseLen, addLen, unitLen, totalLen, withWasteLen, weight,
                stockCount, purchaseMode:isMeterPurchase(dia)?'meter':'stock', note:item.note || ''
            };
            rows.push(row);
            return row;
        }

        function addCutTon(rebarTons, row) {
            if (!row) return;
            rebarTons[row.dia] = (rebarTons[row.dia]||0) + row.weight;
        }

        function summarizeRebarByDia(rows, params) {
            const sum = {};
            rows.forEach(r => {
                if (!sum[r.dia]) sum[r.dia] = { dia:r.dia, weight:0, len:0 };
                sum[r.dia].weight += r.weight;
                sum[r.dia].len += r.withWasteLen;
            });
            return Object.keys(sum).map(Number).sort((a,b)=>a-b).map(dia => {
                const s = sum[dia];
                s.stock = (!isMeterPurchase(dia) && params.stockLen > 0) ? Math.ceil(s.len / params.stockLen) : 0;
                s.purchaseLen = isMeterPurchase(dia) ? s.len : (params.stockLen > 0 ? s.stock * params.stockLen : s.len);
                s.purchaseWeight = ton(dia, s.purchaseLen);
                return s;
            });
        }

        function calculateAll() {
            for (let f of [1,2]) collectFloorInputs(f);
            const p25 = parseFloat(priceInputs.module25.value)||0, p32 = parseFloat(priceInputs.module32.value)||0;
            const pI25 = parseFloat(priceInputs.insert25.value)||0, pI32 = parseFloat(priceInputs.insert32.value)||0;
            const pH = parseFloat(priceInputs.hook.value)||0, pC = parseFloat(priceInputs.concrete.value)||0;
            const pRebar = parseFloat(priceInputs.rebar.value)||0;
            const cutParams = getCutParams();

            const fr = { 1:{}, 2:{} };
            let tA25=0, tA32=0, tI25=0, tI32=0, tMI25=0, tMI32=0, tOI25=0, tOI32=0, tH=0, tWC=0, tRC=0, tBC=0, tCC=0, tIC=0, tSC=0;
            let rebarTons = {}, rebarCutRows = [];
            let totalMod25 = { area:0, c90:0, c60:0, big:0, small:0, bT:0, sT:0, blk:0 };
            let totalMod32 = { area:0, c90:0, c60:0, big:0, small:0, bT:0, sT:0, blk:0 };

            for (let f of [1,2]) {
                const d = floorData[f];
                const mod = calcFloorModules(f);
                const beams = d.beams || [];
                let bC=0, bP=0, colC=0;
                let rLen = safeEval(d.roofLengthExpr), rWid = safeEval(d.roofWidthExpr);
                let rC=0, rR={ lenBottom:0, lenTop:0, bottomDia:12, topDia:10, spacing:200 };
                let iA = safeEval(d.insulAreaExpr), iV=0, iCost=0, iBlk=0;
                let wC=0, wR={ lenHoriz:0, lenVert:0, horizDia:10, vertDia:12 };
                let cR={ mainLen:0, stirrupLen:0, mainDia:12, stirrupDia:6, stirrupCount:0 };

                if (mod) {
                    wR = calcFloorRebar(f, mod);
                    const cv25 = cavityVolume['25'], cv32 = cavityVolume['32'];
                    wC += mod.count90_25*cv25['90直板']+mod.count60_25*cv25['60直板']+mod.bigCorner25*cv25['大角']+mod.smallCorner25*cv25['小角']+mod.bigT25*cv25['大T']+mod.smallT25*cv25['小T'];
                    wC += mod.count90_32*cv32['90直板']+mod.count60_32*cv32['60直板']+mod.bigCorner32*cv32['大角']+mod.smallCorner32*cv32['小角']+mod.bigT32*cv32['大T']+mod.smallT32*cv32['小T'];
                    fr[f] = {
                        a25:mod.area25, a32:mod.area32,
                        blk25:mod.count90_25+mod.count60_25+mod.bigCorner25+mod.smallCorner25+mod.bigT25+mod.smallT25,
                        blk32:mod.count90_32+mod.count60_32+mod.bigCorner32+mod.smallCorner32+mod.bigT32+mod.smallT32,
                        c90_25:mod.count90_25, c90_32:mod.count90_32, c60_25:mod.count60_25, c60_32:mod.count60_32,
                        b25:mod.bigCorner25, s25:mod.smallCorner25, bt25:mod.bigT25, st25:mod.smallT25,
                        b32:mod.bigCorner32, s32:mod.smallCorner32, bt32:mod.bigT32, st32:mod.smallT32,
                        i25:mod.insert25, i32:mod.insert32, mp25:mod.modulePart25, mp32:mod.modulePart32, oi25:mod.openingInsert25, oi32:mod.openingInsert32, hooks:mod.totalHooks, wC:wC, wR:wR
                    };
                    totalMod25.area += mod.area25; totalMod25.c90 += mod.count90_25; totalMod25.c60 += mod.count60_25;
                    totalMod25.big += mod.bigCorner25; totalMod25.small += mod.smallCorner25;
                    totalMod25.bT += mod.bigT25; totalMod25.sT += mod.smallT25; totalMod25.blk += fr[f].blk25;
                    totalMod32.area += mod.area32; totalMod32.c90 += mod.count90_32; totalMod32.c60 += mod.count60_32;
                    totalMod32.big += mod.bigCorner32; totalMod32.small += mod.smallCorner32;
                    totalMod32.bT += mod.bigT32; totalMod32.sT += mod.smallT32; totalMod32.blk += fr[f].blk32;
                } else {
                    fr[f] = { a25:0, a32:0, blk25:0, blk32:0, c90_25:0, c90_32:0, c60_25:0, c60_32:0, b25:0, s25:0, bt25:0, st25:0, b32:0, s32:0, bt32:0, st32:0, i25:0, i32:0, mp25:0, mp32:0, oi25:0, oi32:0, hooks:0, wC:0, wR:{ lenHoriz:0, lenVert:0, horizDia:10, vertDia:12 } };
                }
                cR = calcColumnRebar(d);
                colC = cR.concreteVolume || 0;

                let beamStirrupCount=0, beamIndex=0;
                for (const b of beams) {
                    beamIndex++;
                    if (b.len>0 && b.wid>0 && b.hgt>0) {
                        bC += b.len*b.wid*b.hgt; bP += b.len*b.wid;
                        const s = calcSingleBeamRebar(b);
                        addCutTon(rebarTons, addCutItem(rebarCutRows, cutParams, { floor:`${f}层`, part:'梁', name:`梁${beamIndex}主筋`, dia:s.mainDia, count:b.mainCount||3, baseLen:b.len, addLen:hookLen(s.mainDia, cutParams.mainHookD), note:'两端弯头/锚固' }));
                        addCutTon(rebarTons, addCutItem(rebarCutRows, cutParams, { floor:`${f}层`, part:'梁', name:`梁${beamIndex}面筋`, dia:s.secDia, count:b.secCount||2, baseLen:b.len, addLen:hookLen(s.secDia, cutParams.mainHookD), note:'两端弯头/锚固' }));
                        addCutTon(rebarTons, addCutItem(rebarCutRows, cutParams, { floor:`${f}层`, part:'梁', name:`梁${beamIndex}箍筋`, dia:s.stirrupDia, count:s.stirrupCount, baseLen:2*((b.wid||0.24)+(b.hgt||0.5)), addLen:hookLen(s.stirrupDia, cutParams.stirrupHookD), note:'箍筋两端弯钩' }));
                        beamStirrupCount += s.stirrupCount;
                    }
                }

                if (rLen>0 && rWid>0) {
                    let area = rLen*rWid; if (d.roofDeduct&&bP>0) area = Math.max(0, area-bP);
                    rC = area*(d.roofThick||0);
                    rR = calcRoofRebar(rLen, rWid, d.roofBottomDia||12, d.roofTopDia||10, d.roofSpacing||200);
                }
                if (iA>0) { iV = iA*((d.insulThick||50)/1000); iCost = iV*(d.insulPrice||330); iBlk = (d.insulUnitArea>0)?Math.ceil(iA/d.insulUnitArea):0; }

                const wr = fr[f].wR;
                const horizGroups = (wr.horizGroups && wr.horizGroups.length) ? wr.horizGroups : [{ count:wr.horizCount||0, baseLen:wr.horizBaseLen||0 }];
                horizGroups.forEach((g, idx) => {
                    addCutTon(rebarTons, addCutItem(rebarCutRows, cutParams, { floor:`${f}层`, part:'墙体', name:horizGroups.length>1 ? `水平分布筋${idx+1}` : '水平分布筋', dia:wr.horizDia, count:g.count||0, baseLen:g.baseLen||0, addLen:hookLen(wr.horizDia, cutParams.wallHookD), note:'按洞口离地高度分层扣减估算' }));
                });
                addCutTon(rebarTons, addCutItem(rebarCutRows, cutParams, { floor:`${f}层`, part:'墙体', name:'竖向筋', dia:wr.vertDia, count:wr.vertCount||0, baseLen:wr.vertBaseLen||0, addLen:hookLen(wr.vertDia, cutParams.wallHookD), note:'上下端锚固估算' }));
                (d.openings||[]).forEach((op, idx) => {
                    if (op.width>0 && op.count>0) {

                (cR.items||[]).forEach(col => {

                });

                if (rR.len > 0 && rR.wid > 0) {

                    addCutTon(rebarTons, addCutItem(rebarCutRows, cutParams, { floor:`${f}层`, part:'顶板', name:'底筋短向', dia:rR.bottomDia, count:rR.barsWid, baseLen:rR.wid, addLen:hookLen(rR.bottomDia, cutParams.roofHookD), note:'双层双向底筋' }));
                    addCutTon(rebarTons, addCutItem(rebarCutRows, cutParams, { floor:`${f}层`, part:'顶板', name:'面筋长向', dia:rR.topDia, count:rR.barsLen, baseLen:rR.len, addLen:hookLen(rR.topDia, cutParams.roofHookD), note:'双层双向面筋' }));

                { 分类:'建房配件', 项目:'25洞口插板', 数量:tOI25, 单位:'块', 采购规则:'门窗洞口两侧插板', 单价:pI25 ? `${pI25.toFixed(2)}元/块` : '', 金额:(tOI25*pI25).toFixed(2), 备注:'' },

                { 分类:'建房配件', 项目:'钢丝勾', 数量:tH, 单位:'个', 采购规则:'角部/T型/长直墙估算', 单价:pH ? `${pH.toFixed(2)}元/个` : '', 金额:(tH*pH).toFixed(2), 备注:'' },
                { 分类:'混凝土', 项目:'墙体混凝土', 数量:tWC.toFixed(2), 单位:'m3', 采购规则:'按空腔体积估算', 单价:pC ? `${pC.toFixed(2)}元/m3` : '', 金额:(tWC*pC).toFixed(2), 备注:'' },
                { 分类:'混凝土', 项目:'顶板混凝土', 数量:tRC.toFixed(2), 单位:'m3', 采购规则:'按板面积×厚度估算', 单价:pC ? `${pC.toFixed(2)}元/m3` : '', 金额:(tRC*pC).toFixed(2), 备注:'' },
                { 分类:'混凝土', 项目:'梁混凝土', 数量:tBC.toFixed(2), 单位:'m3', 采购规则:'按梁长×宽×高估算', 单价:pC ? `${pC.toFixed(2)}元/m3` : '', 金额:(tBC*pC).toFixed(2), 备注:'' },
                { 分类:'混凝土', 项目:'构造柱混凝土', 数量:tCC.toFixed(2), 单位:'m3', 采购规则:'按柱截面×高度估算', 单价:pC ? `${pC.toFixed(2)}元/m3` : '', 金额:(tCC*pC).toFixed(2), 备注:'' },

                { 分类:'保温板', 项目:'保温板总价', 数量:'', 单位:'', 采购规则:'按各楼层保温板参数估算', 单价:'', 金额:tIC.toFixed(2), 备注:'' },
                ...makeRebarSummaryCsvRows(rebarCutRows, cutParams, pRebar),

                { 分类:'费用合计', 项目:'钢筋总价', 数量:'', 单位:'', 采购规则:'由钢筋下料单汇总', 单价:pRebar ? `${pRebar.toFixed(2)}元/吨` : '', 金额:totalRebarCostAll.toFixed(2), 备注:'' },
                { 分类:'费用合计', 项目:'合计总价', 数量:'', 单位:'', 采购规则:'模块+建房配件+混凝土+保温板+钢筋', 单价:'', 金额:totalCost.toFixed(2), 备注:'' }
            ];
            const rebarListHtml = buildCutListHtml(rebarCutRows, cutParams, pRebar);
            latestResult = {
                materialRows,
                rebarRows: makeRebarCsvRows(rebarCutRows, cutParams),
                rebarPrintHtml: rebarListHtml
            };

            let html = '<div class="result-summary-grid">';
            html += summaryTileHtml('合计总价', `${totalCost.toFixed(2)} 元`, '模块、建房配件、混凝土、保温板、钢筋合计');
            html += summaryTileHtml('混凝土合计', `${tC.toFixed(2)} m³`, `墙体${tWC.toFixed(2)} + 顶板${tRC.toFixed(2)} + 梁柱${(tBC+tCC).toFixed(2)}`);
            html += summaryTileHtml('模块面积', `${(totalMod25.area+totalMod32.area).toFixed(2)} m²`, `25墙${totalMod25.area.toFixed(2)}，32墙${totalMod32.area.toFixed(2)}`);
            html += summaryTileHtml('钢筋费用', `${totalRebarCostAll.toFixed(2)} 元`, '由最下面钢筋下料单汇总');
            html += '</div>';

            html += '<div class="result-section-title">各楼层用量</div>';
            for (let f of [1,2]) {
                const r = fr[f];
                html += `<div class="result-section-title">${f}层</div><div class="result-grid">`;
                html += blockHtml('25墙模块', [
                    metricHtml('面积', `${r.a25.toFixed(2)} m²`, 'important'),
                    metricHtml('总块数', `${r.blk25} 块`, 'important'),
                    metricHtml('90直板', `${r.c90_25} 块`),
                    metricHtml('60直板', `${r.c60_25} 块`),
                    metricHtml('大角 / 小角', `${r.b25} / ${r.s25}`),
                    metricHtml('大T / 小T', `${r.bt25} / ${r.st25}`),
                    metricHtml('模块金额', `<span class="price-value">${r.mC25.toFixed(2)} 元</span>`, 'total-line')
                ]);
                html += blockHtml('32墙模块', [
                    metricHtml('面积', `${r.a32.toFixed(2)} m²`, 'important'),
                    metricHtml('总块数', `${r.blk32} 块`, 'important'),
                    metricHtml('90直板', `${r.c90_32} 块`),
                    metricHtml('60直板', `${r.c60_32} 块`),
                    metricHtml('大角 / 小角', `${r.b32} / ${r.s32}`),
                    metricHtml('大T / 小T', `${r.bt32} / ${r.st32}`),
                    metricHtml('模块金额', `<span class="price-value">${r.mC32.toFixed(2)} 元</span>`, 'total-line')
                ]);
                html += blockHtml('建房配件', [
                    metricHtml('洞口插板 25 / 32', `${r.oi25} / ${r.oi32}`, 'important'),
                    metricHtml('钢丝勾', `${r.hooks} 个`)
                ]);
                html += blockHtml('混凝土、保温板、箍筋', [
                    metricHtml('梁混凝土', `${r.bC.toFixed(2)} m³`),
                    metricHtml('构造柱混凝土', `${r.colC.toFixed(2)} m³`),
                    metricHtml('顶板混凝土', `${r.rC.toFixed(2)} m³`),
                    metricHtml('本层混凝土合计', `${r.cV.toFixed(2)} m³`, 'important'),
                    metricHtml('混凝土金额', `<span class="price-value">${r.cCost.toFixed(2)} 元</span>`, 'total-line'),
                    metricHtml('保温板体积', `${r.iV.toFixed(4)} m³`),
                    metricHtml('保温板块数', `${r.iBlk} 块`),
                    metricHtml('保温板金额', `<span class="price-value">${r.iCost.toFixed(2)} 元</span>`),
                    metricHtml('箍筋总根数', `${r.sC} 根`)
                ], 'wide');
                html += '</div>';
            }

            html += '<div class="result-section-title">材料与费用合计</div><div class="result-grid">';
            html += blockHtml('25墙模块合计', [
                metricHtml('面积', `${totalMod25.area.toFixed(2)} m²`, 'important'),
                metricHtml('总块数', `${totalMod25.blk} 块`, 'important'),
                metricHtml('90直板', `${totalMod25.c90} 块`),
                metricHtml('60直板', `${totalMod25.c60} 块`),
                metricHtml('大角 / 小角', `${totalMod25.big} / ${totalMod25.small}`),
                metricHtml('大T / 小T', `${totalMod25.bT} / ${totalMod25.sT}`),
                metricHtml('模块金额', `<span class="price-value">${(totalMod25.area*p25).toFixed(2)} 元</span>`, 'total-line')
            ]);
            html += blockHtml('32墙模块合计', [
                metricHtml('面积', `${totalMod32.area.toFixed(2)} m²`, 'important'),
                metricHtml('总块数', `${totalMod32.blk} 块`, 'important'),
                metricHtml('90直板', `${totalMod32.c90} 块`),
                metricHtml('60直板', `${totalMod32.c60} 块`),
                metricHtml('大角 / 小角', `${totalMod32.big} / ${totalMod32.small}`),
                metricHtml('大T / 小T', `${totalMod32.bT} / ${totalMod32.sT}`),
                metricHtml('模块金额', `<span class="price-value">${(totalMod32.area*p32).toFixed(2)} 元</span>`, 'total-line')
            ]);
            html += blockHtml('建房配件合计', [
                metricHtml('洞口插板 25 / 32', `${tOI25} / ${tOI32}`, 'important'),
                metricHtml('洞口插板金额', `<span class="price-value">${cI.toFixed(2)} 元</span>`),
                metricHtml('钢丝勾金额', `<span class="price-value">${cH.toFixed(2)} 元</span>`),
                metricHtml('模块及建房配件合计', `<span class="price-value">${cMP.toFixed(2)} 元</span>`, 'total-line')
            ]);
            html += blockHtml('混凝土合计', [
                metricHtml('墙体混凝土', `${tWC.toFixed(2)} m³`),
                metricHtml('顶板混凝土', `${tRC.toFixed(2)} m³`),
                metricHtml('梁混凝土', `${tBC.toFixed(2)} m³`),
                metricHtml('构造柱混凝土', `${tCC.toFixed(2)} m³`),
                metricHtml('混凝土总量', `${tC.toFixed(2)} m³`, 'important'),
                metricHtml('混凝土金额', `<span class="price-value">${cCost.toFixed(2)} 元</span>`, 'total-line')
            ]);
            html += blockHtml('保温板与总价', [
                metricHtml('保温板金额', `<span class="price-value">${tIC.toFixed(2)} 元</span>`),
                metricHtml('钢筋金额', `<span class="price-value">${totalRebarCostAll.toFixed(2)} 元</span>`),
                metricHtml('合计总价', `<span class="price-value">${totalCost.toFixed(2)} 元</span>`, 'total-line')
            ], 'wide');

            const rebarQuickItems = [];
            rebarPurchaseSummaries.forEach(s => {
                const cost = s.purchaseWeight * pRebar;
                rebarQuickItems.push(metricHtml(`Φ${s.dia}`, `${purchaseText(s.dia, s.len, s.stock, cutParams)} · ${s.purchaseWeight.toFixed(3)} t · <span class="price-value">${cost.toFixed(2)} 元</span>`));
            });
            rebarQuickItems.push(metricHtml('箍筋总根数', `${tSC} 根`));
            rebarQuickItems.push(metricHtml('钢筋总价', `<span class="price-value">${totalRebarCostAll.toFixed(2)} 元</span>`, 'total-line'));
            html += blockHtml('钢筋费用快览', rebarQuickItems, 'wide');
            html += '</div>';
            html += `<div id="rebarPrintSection" class="rebar-print-section">${rebarListHtml}</div>`;
            $('resultContent').innerHTML = html;
        }

        function saveToLocal() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                prices: { module25:priceInputs.module25.value, module32:priceInputs.module32.value, insert25:priceInputs.insert25.value, insert32:priceInputs.insert32.value, hook:priceInputs.hook.value, concrete:priceInputs.concrete.value, rebar:priceInputs.rebar.value },
                cut: { stockLen:$('cutStockLen').value, wasteRate:$('cutWasteRate').value, wallHookD:$('cutWallHookD').value, mainHookD:$('cutMainHookD').value, roofHookD:$('cutRoofHookD').value, stirrupHookD:$('cutStirrupHookD').value },
                floors: floorData
            }));
        }
        function loadFromLocal() {
            const raw = localStorage.getItem(STORAGE_KEY); if (!raw) return;
            try {
                const saved = JSON.parse(raw);
                if (saved.prices) { for (let k in saved.prices) { if (priceInputs[k]) priceInputs[k].value = saved.prices[k]; } }
                if (saved.cut) {
                    const ids = { stockLen:'cutStockLen', wasteRate:'cutWasteRate', wallHookD:'cutWallHookD', mainHookD:'cutMainHookD', roofHookD:'cutRoofHookD', stirrupHookD:'cutStirrupHookD' };
                    for (let k in ids) { if ($(ids[k]) && saved.cut[k] !== undefined) $(ids[k]).value = saved.cut[k]; }
                }
                if (saved.floors) { for (let f of [1,2]) if (saved.floors[f]) floorData[f] = { ...floorData[f], ...saved.floors[f], walls:saved.floors[f].walls || [], columns:saved.floors[f].columns || [] }; }
            } catch (e) {}
        }
        function init() {
            loadFromLocal();
            renderFloorPanel(1); renderFloorPanel(2); renderWalls(1); renderWalls(2); renderColumns(1); renderColumns(2); renderOpenings(1); renderOpenings(2); renderBeams(1); renderBeams(2);

            $('clearFloor2').addEventListener('click', () => clearFloor(2));
            $('exportMaterialCsv').addEventListener('click', exportMaterialCsv);
            $('exportRebarCsv').addEventListener('click', exportRebarCsv);
            $('printRebarPdf').addEventListener('click', printRebarPdf);
            $('printResults').addEventListener('click', () => window.print());

            }));
            document.querySelectorAll('input, select').forEach(el => {
                if (el.closest('.floor-panel')) return;
                el.addEventListener('input', () => { saveToLocal(); calculateAll(); });
                if (el.type === 'checkbox') el.addEventListener('change', () => { saveToLocal(); calculateAll(); });
            });
            calculateAll();
        }
        init();
    })();
