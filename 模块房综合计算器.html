<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>模块房综合计算器 · 输入标签</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, -apple-system, 'Microsoft YaHei', sans-serif; }
        body { background: #f5f7fa; padding: 16px; font-size: 18px; color: #1e293b; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .container { background: white; border-radius: 24px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 1300px; margin: 0 auto; }
        h1 { font-size: 2.2rem; text-align: center; color: #2d3748; font-weight: 600; margin-bottom: 6px; }
        .subtitle { text-align: center; color: #718096; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #e2e8f0; font-size: 0.95rem; }
        .section { background: #f8fafc; border-radius: 16px; padding: 18px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
        .section-title { font-size: 1.2rem; font-weight: 600; color: #1e3a5f; display: flex; align-items: center; gap: 8px; }
        .section-title::before { content: ''; display: inline-block; width: 5px; height: 22px; background: #4285f4; border-radius: 2px; }
        .btn-clear { background: #fff; border: 1px solid #cbd5e1; color: #475569; border-radius: 20px; padding: 5px 14px; font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
        .btn-clear:hover { background: #fee2e2; border-color: #f87171; color: #b91c1c; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 12px; }
        .grid-3 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 12px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 8px; }
        .input-group { margin-bottom: 10px; }
        label { display: block; font-weight: 500; color: #4a5568; margin-bottom: 6px; font-size: 0.85rem; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 0.9rem; background: #f8fafc; outline: none; transition: 0.2s; }
        input:focus, select:focus { border-color: #4285f4; background: white; box-shadow: 0 0 0 3px rgba(66,133,244,0.12); }
        .radio-group { display: flex; gap: 20px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .radio-group label { display: flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer; font-size: 0.95rem; }
        .radio-group input[type="radio"] { width: auto; accent-color: #4285f4; }
        .floor-tabs { display: flex; gap: 10px; margin-bottom: 16px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
        .floor-tab { background: #e2e8f0; border: none; padding: 10px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
        .floor-tab.active { background: #4285f4; color: white; }
        .floor-panel { display: none; }
        .floor-panel.active-panel { display: block; }
        .checkbox-row { margin: 10px 0; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .checkbox-row input[type="checkbox"] { width: auto; accent-color: #4285f4; }
        .beam-section, .roof-panel, .plate-panel, .rebar-panel, .column-panel { background: #f1f5f9; border-radius: 14px; padding: 14px; margin-top: 14px; border: 1px solid #e2e8f0; }
        .result-card { background: white; border-radius: 16px; padding: 22px; margin-top: 12px; border: 1px solid #e2e8f0; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
        .result-title { font-size: 1.3rem; font-weight: 600; color: #2d3748; text-align: center; margin-bottom: 16px; }
        .result-section-title { font-size: 1.1rem; font-weight: 600; color: #1e3a5f; margin: 14px 0 8px; padding-bottom: 6px; border-bottom: 1px solid #e2e8f0; }
        .result-subtitle { font-weight: 600; color: #475569; margin: 10px 0 4px; font-size: 0.95rem; }
        .result-item { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; font-size: 0.95rem; border-bottom: 1px dashed #e2e8f0; }
        .result-item:last-child { border-bottom: none; }
        .result-label { color: #4a5568; }
        .result-value { font-weight: 600; color: #1e293b; }
        .price-value { font-weight: 700; color: #1e293b; }
        .total { font-weight: 700; border-top: 2px solid #4285f4; margin-top: 8px; padding-top: 8px; }
        .total-heavy { border-top: 3px solid #4285f4; margin-top: 10px; padding-top: 10px; }
        .subnote { font-size: 0.8rem; color: #718096; text-align: center; margin-top: 14px; }
        .opening-row, .beam-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; background: white; padding: 8px; border-radius: 12px; flex-wrap: wrap; border: 1px solid #e2e8f0; }
        .beam-row input { flex: 1; min-width: 45px; margin: 0; font-size: 0.8rem; padding: 6px; }
        .beam-header, .opening-header { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; font-size: 0.7rem; color: #64748b; font-weight: 600; padding: 0 4px; }
        .beam-header span, .opening-header span { text-align: center; }
        .btn-small { background: #ea4335; border: none; border-radius: 30px; padding: 6px 12px; color: white; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
        .btn-small.add { background: #34a853; }
        @media (max-width: 800px) {
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
            .container { padding: 16px; }
            body { font-size: 16px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🏗️ 模块房综合计算器</h1>
    <div class="subtitle">梁钢筋分组汇总 · 顶板长宽精确 · 洞口过梁恢复</div>

    <!-- 材料单价 -->
    <div class="section">
        <div class="section-header">
            <span class="section-title">⚙️ 材料单价</span>
            <button class="btn-clear" id="clearMaterialPrice">🗑️ 清空</button>
        </div>
        <div class="grid-2">
            <div class="input-group"><label>25模块单价 (元/㎡)</label><input type="number" id="priceModule25" value="55" step="1"></div>
            <div class="input-group"><label>32模块单价 (元/㎡)</label><input type="number" id="priceModule32" value="65" step="1"></div>
            <div class="input-group"><label>25插板单价 (元/块)</label><input type="number" id="priceInsert25" value="10"></div>
            <div class="input-group"><label>32插板单价 (元/块)</label><input type="number" id="priceInsert32" value="10"></div>
            <div class="input-group"><label>钢丝勾单价 (元/个)</label><input type="number" id="priceHook" value="0.5" step="0.1"></div>
            <div class="input-group"><label>混凝土单价 (元/m³)</label><input type="number" id="priceConcrete" value="500" step="10"></div>
        </div>
        <div class="section-title" style="margin-top:12px;">⚡ 钢筋单价</div>
        <div class="grid-2">
            <div class="input-group"><label>统一钢筋单价 (元/吨)</label><input type="number" id="priceRebar" step="10" value="3000"></div>
        </div>
    </div>

    <!-- 楼层参数 -->
    <div class="section">
        <div class="section-header">
            <span class="section-title">🏠 楼层参数</span>
            <span>
                <button class="btn-clear" id="clearFloor1">🗑️ 清空一层</button>
                <button class="btn-clear" id="clearFloor2" style="margin-left:8px;">🗑️ 清空二层</button>
            </span>
        </div>
        <div class="floor-tabs" id="floorTabs">
            <button class="floor-tab active" data-floor="1">🏡 一层</button>
            <button class="floor-tab" data-floor="2">🏡 二层</button>
        </div>
        <div id="floor1Panel" class="floor-panel active-panel"></div>
        <div id="floor2Panel" class="floor-panel"></div>
    </div>

    <!-- 结果 -->
    <div class="result-card" id="results">
        <div class="result-title">📊 计算结果</div>
        <div id="resultContent">输入参数后自动计算</div>
    </div>
    <div class="subnote">* 数据自动保存 · 钢筋按吨计价 · 墙体长度按中线</div>
</div>

<script>
    (function() {
        const MODULE_HEIGHT = 0.3;
        const AREA_90 = 0.27;
        const AREA_60 = 0.18;
        const MODULE_AREA = {
            '25': { 大角:0.36, 小角:0.18, 大T:0.4125, 小T:0.3225 },
            '32': { 大角:0.456, 小角:0.276, 大T:0.402,  小T:0.312 }
        };
        const cavityVolume = {
            '25': {
                '90直板': 0.9*0.14*0.3, '60直板': 0.6*0.14*0.3,
                '大角': 1.2*0.14*0.3, '小角': 0.605*0.14*0.3,
                '大T': 1.375*0.14*0.3, '小T': 1.08*0.14*0.3
            },
            '32': {
                '90直板': 0.9*0.21*0.3, '60直板': 0.6*0.21*0.3,
                '大角': 1.2*0.21*0.3, '小角': 0.6*0.21*0.3,
                '大T': 1.2*0.21*0.3+0.14*0.14*0.3, '小T': 0.6*0.21*0.3+0.44*0.14*0.3
            }
        };
        const theoreticalKgPerM = (d) => 0.00617 * d * d;
        const defaultBeamConfig = { len:3, wid:0.24, hgt:0.5, mainDia:22, mainCount:3, secDia:18, secCount:2, stirrupDia:6, stirrupSpacing:200 };

        const defaultFloorData = {
            1: { mode: 'all25', openings: [], beams: [], height: 3.6, wallCount: 6,
                  extHor: '', extVer: '', extCorners: 0, intHor: '', intVer: '', intCorners: 0, tWalls: 6,
                  wallVertDia: 12, wallHorizDia: 10,
                  colCount: 6, colMainDia: 12, colMainCount: 4, colStirrupDia: 6, colStirrupSpacing: 200, colWidth: 250, colHeight: 250,
                  roofLengthExpr: '10', roofWidthExpr: '8', roofThick: 0.12, roofDeduct: false, roofBottomDia: 12, roofTopDia: 10, roofSpacing: 200,
                  insulAreaExpr: '0', insulUnitArea: 0.732, insulThick: 50, insulPrice: 330 },
            2: { mode: 'mixed', openings: [], beams: [], height: 3.3, wallCount: 6,
                  extHor: '', extVer: '', extCorners: 5, intHor: '', intVer: '', intCorners: 0, tWalls: 4,
                  wallVertDia: 12, wallHorizDia: 10,
                  colCount: 5, colMainDia: 12, colMainCount: 4, colStirrupDia: 6, colStirrupSpacing: 200, colWidth: 250, colHeight: 250,
                  roofLengthExpr: '8', roofWidthExpr: '6', roofThick: 0.12, roofDeduct: false, roofBottomDia: 12, roofTopDia: 10, roofSpacing: 200,
                  insulAreaExpr: '0', insulUnitArea: 0.732, insulThick: 50, insulPrice: 330 }
        };
        const floorData = JSON.parse(JSON.stringify(defaultFloorData));
        const STORAGE_KEY = 'houseCalcV40_labels';
        const $ = id => document.getElementById(id);
        const priceInputs = {
            module25: $('priceModule25'), module32: $('priceModule32'),
            insert25: $('priceInsert25'), insert32: $('priceInsert32'),
            hook: $('priceHook'), concrete: $('priceConcrete'),
            rebar: $('priceRebar')
        };

        function safeEval(e) {
            if (!e || typeof e !== 'string') return 0;
            const t = e.replace(/\s/g,'');
            if (/^[0-9+\-*/().]+$/.test(t)) { try { return eval(t); } catch { return 0; } }
            return parseFloat(e) || 0;
        }
        function clearInputs(ids) { ids.forEach(id => { const el = $(id); if (el) el.value = ''; }); }
        function clearMaterialPrice() { clearInputs(['priceModule25','priceModule32','priceInsert25','priceInsert32','priceHook','priceConcrete']); saveToLocal(); calculateAll(); }
        function clearFloor(f) {
            floorData[f] = JSON.parse(JSON.stringify(defaultFloorData[f]));
            renderFloorPanel(f); renderOpenings(f); renderBeams(f); saveToLocal(); calculateAll();
        }
        function collectFloorInputs(f) {
            const d = floorData[f];
            const c = document.getElementById(`floor${f}Panel`);
            if (!c) return;
            const mr = c.querySelector(`input[name="mode${f}"]:checked`);
            if (mr) d.mode = mr.value;
            const h = c.querySelector(`#height${f}`); if (h) d.height = parseFloat(h.value) || '';
            const wc = c.querySelector(`#wallCount${f}`); if (wc) d.wallCount = parseInt(wc.value) || '';
            if (d.mode === 'all25') {
                d.extHor = ''; d.extVer = ''; d.extCorners = '';
                const hor = c.querySelector(`#hor${f}`), ver = c.querySelector(`#ver${f}`), corners = c.querySelector(`#corners${f}`), tWalls = c.querySelector(`#tWalls${f}`);
                if (hor) d.intHor = hor.value; if (ver) d.intVer = ver.value; if (corners) d.intCorners = parseInt(corners.value) || ''; if (tWalls) d.tWalls = parseInt(tWalls.value) || '';
            } else {
                const extHor = c.querySelector(`#extHor${f}`), extVer = c.querySelector(`#extVer${f}`), extCorners = c.querySelector(`#extCorners${f}`), intHor = c.querySelector(`#intHor${f}`), intVer = c.querySelector(`#intVer${f}`), intCorners = c.querySelector(`#intCorners${f}`), tWalls = c.querySelector(`#tWalls${f}`);
                if (extHor) d.extHor = extHor.value; if (extVer) d.extVer = extVer.value; if (extCorners) d.extCorners = parseInt(extCorners.value) || ''; if (intHor) d.intHor = intHor.value; if (intVer) d.intVer = intVer.value; if (intCorners) d.intCorners = parseInt(intCorners.value) || ''; if (tWalls) d.tWalls = parseInt(tWalls.value) || '';
            }
            const wvd = c.querySelector(`#wallVertDia${f}`); if (wvd) d.wallVertDia = parseInt(wvd.value) || 12;
            const whd = c.querySelector(`#wallHorizDia${f}`); if (whd) d.wallHorizDia = parseInt(whd.value) || 10;
            const cc = c.querySelector(`#colCount${f}`); if (cc) d.colCount = parseInt(cc.value) || 0;
            const cmd = c.querySelector(`#colMainDia${f}`); if (cmd) d.colMainDia = parseInt(cmd.value) || 12;
            const cmc = c.querySelector(`#colMainCount${f}`); if (cmc) d.colMainCount = parseInt(cmc.value) || 4;
            const csd = c.querySelector(`#colStirrupDia${f}`); if (csd) d.colStirrupDia = parseInt(csd.value) || 6;
            const css = c.querySelector(`#colStirrupSpacing${f}`); if (css) d.colStirrupSpacing = parseInt(css.value) || 200;
            const cw = c.querySelector(`#colWidth${f}`); if (cw) d.colWidth = parseInt(cw.value) || 250;
            const ch = c.querySelector(`#colHeight${f}`); if (ch) d.colHeight = parseInt(ch.value) || 250;
            const rl = c.querySelector(`#roofLength${f}`); if (rl) d.roofLengthExpr = rl.value;
            const rw = c.querySelector(`#roofWidth${f}`); if (rw) d.roofWidthExpr = rw.value;
            const rt = c.querySelector(`#roofThick${f}`); if (rt) d.roofThick = parseFloat(rt.value) || '';
            const rdd = c.querySelector(`#roofDeduct${f}`); if (rdd) d.roofDeduct = rdd.checked;
            const rbd = c.querySelector(`#roofBottomDia${f}`); if (rbd) d.roofBottomDia = parseInt(rbd.value) || 12;
            const rtd = c.querySelector(`#roofTopDia${f}`); if (rtd) d.roofTopDia = parseInt(rtd.value) || 10;
            const rsp = c.querySelector(`#roofSpacing${f}`); if (rsp) d.roofSpacing = parseInt(rsp.value) || 200;
            const ia = c.querySelector(`#insulArea${f}`), iu = c.querySelector(`#insulUnit${f}`), it = c.querySelector(`#insulThick${f}`), ip = c.querySelector(`#insulPrice${f}`);
            if (ia) d.insulAreaExpr = ia.value; if (iu) d.insulUnitArea = parseFloat(iu.value) || ''; if (it) d.insulThick = parseFloat(it.value) || ''; if (ip) d.insulPrice = parseFloat(ip.value) || '';
            d.beams = [];
            const bc = c.querySelector(`#beamContainer${f}`);
            if (bc) bc.querySelectorAll('.beam-row').forEach(row => {
                const len = parseFloat(row.querySelector('.beam-len').value) || 0;
                const wid = parseFloat(row.querySelector('.beam-wid').value) || 0;
                const hgt = parseFloat(row.querySelector('.beam-hgt').value) || 0;
                const md = parseInt(row.querySelector('.beam-md').value) || 22;
                const mc = parseInt(row.querySelector('.beam-mc').value) || 3;
                const sd = parseInt(row.querySelector('.beam-sd').value) || 18;
                const sc = parseInt(row.querySelector('.beam-sc').value) || 2;
                const std = parseInt(row.querySelector('.beam-std').value) || 6;
                const sts = parseInt(row.querySelector('.beam-sts').value) || 200;
                if (len > 0 && wid > 0 && hgt > 0) d.beams.push({ len, wid, hgt, mainDia:md, mainCount:mc, secDia:sd, secCount:sc, stirrupDia:std, stirrupSpacing:sts });
            });
        }

        function renderBeams(f) {
            const c = document.getElementById(`beamContainer${f}`);
            if (!c) return; c.innerHTML = '';
            (floorData[f].beams || []).forEach((b, idx) => {
                const row = document.createElement('div'); row.className = 'beam-row';
                row.innerHTML = `
                    <input type="number" step="0.01" placeholder="长(m)" value="${b.len}" class="beam-len" style="flex:1.2">
                    <input type="number" step="0.01" placeholder="宽(m)" value="${b.wid}" class="beam-wid" style="flex:1">
                    <input type="number" step="0.01" placeholder="高(m)" value="${b.hgt}" class="beam-hgt" style="flex:1">
                    <input type="number" step="1" placeholder="主径(mm)" value="${b.mainDia||22}" class="beam-md" style="flex:0.8">
                    <input type="number" step="1" placeholder="根数" value="${b.mainCount||3}" class="beam-mc" style="flex:0.7">
                    <input type="number" step="1" placeholder="面径(mm)" value="${b.secDia||18}" class="beam-sd" style="flex:0.8">
                    <input type="number" step="1" placeholder="根数" value="${b.secCount||2}" class="beam-sc" style="flex:0.7">
                    <input type="number" step="1" placeholder="箍径(mm)" value="${b.stirrupDia||6}" class="beam-std" style="flex:0.7">
                    <input type="number" step="10" placeholder="箍距(mm)" value="${b.stirrupSpacing||200}" class="beam-sts" style="flex:0.8">
                    <button class="btn-small">删除</button>`;
                row.querySelector('.btn-small').addEventListener('click', () => { floorData[f].beams.splice(idx,1); renderBeams(f); saveToLocal(); calculateAll(); });
                row.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => { collectFloorInputs(f); saveToLocal(); calculateAll(); }));
                c.appendChild(row);
            });
        }

        function addBeam(f) { if (!floorData[f].beams) floorData[f].beams = []; floorData[f].beams.push({ ...defaultBeamConfig }); renderBeams(f); saveToLocal(); calculateAll(); }

        function renderFloorPanel(f) {
            const c = document.getElementById(`floor${f}Panel`);
            const d = floorData[f], isMixed = d.mode === 'mixed';
            let html = `<div class="radio-group"><label><input type="radio" name="mode${f}" value="all25" ${!isMixed?'checked':''}> 全25墙</label><label><input type="radio" name="mode${f}" value="mixed" ${isMixed?'checked':''}> 32外墙 + 25内墙</label></div>
                <div class="grid-2"><div class="input-group"><label>墙体高度 (m)</label><input type="number" id="height${f}" step="0.1" value="${d.height}"></div><div class="input-group"><label>墙面数量</label><input type="number" id="wallCount${f}" value="${d.wallCount}" min="1"></div></div>`;
            if (!isMixed) html += `<div class="grid-2"><div class="input-group"><label>横墙总长 (m) 可算式</label><input type="text" id="hor${f}" value="${d.intHor}"></div><div class="input-group"><label>纵墙总长 (m) 可算式</label><input type="text" id="ver${f}" value="${d.intVer}"></div><div class="input-group"><label>拐角数量</label><input type="number" id="corners${f}" value="${d.intCorners}" min="0"></div><div class="input-group"><label>T型墙数量</label><input type="number" id="tWalls${f}" value="${d.tWalls}" min="0"></div></div>`;
            else html += `<div style="font-weight:600;margin:12px 0 6px;">🧱 外墙 (32模块)</div><div class="grid-2"><div class="input-group"><label>外墙横长 (m)</label><input type="text" id="extHor${f}" value="${d.extHor}"></div><div class="input-group"><label>外墙纵长 (m)</label><input type="text" id="extVer${f}" value="${d.extVer}"></div><div class="input-group"><label>外墙拐角</label><input type="number" id="extCorners${f}" value="${d.extCorners}" min="0"></div></div><div style="font-weight:600;margin:12px 0 6px;">🧱 内墙 (25模块)</div><div class="grid-2"><div class="input-group"><label>内墙横长 (m)</label><input type="text" id="intHor${f}" value="${d.intHor}"></div><div class="input-group"><label>内墙纵长 (m)</label><input type="text" id="intVer${f}" value="${d.intVer}"></div><div class="input-group"><label>内墙拐角</label><input type="number" id="intCorners${f}" value="${d.intCorners}" min="0"></div><div class="input-group"><label>T型墙数量</label><input type="number" id="tWalls${f}" value="${d.tWalls}" min="0"></div></div>`;
            html += `<div class="rebar-panel"><div style="font-weight:600;margin-bottom:8px;">🔩 墙体钢筋配置</div><div class="grid-2"><div class="input-group"><label>竖筋直径 (mm)</label><input type="number" id="wallVertDia${f}" value="${d.wallVertDia||12}" min="6" max="25"></div><div class="input-group"><label>横筋直径 (mm)</label><input type="number" id="wallHorizDia${f}" value="${d.wallHorizDia||10}" min="6" max="25"></div></div></div>`;

            html += `<div class="section-title" style="margin-top:12px;">🚪 门窗洞口</div>

        function renderOpenings(f) {

        function addOpening(f) { floorData[f].openings.push({ width:1.0, height:1.8, count:1 }); renderOpenings(f); saveToLocal(); calculateAll(); }

        function calcFloorModules(f) {
            const d = floorData[f]; const H = Number(d.height); if (!H || H <= 0) return null;
            const layers = Math.ceil(H / MODULE_HEIGHT); const openings = d.openings;
            let twa = 0, tib = 0;
            for (let op of openings) { if (op.width>0 && op.height>0 && op.count>0) { twa += op.width*op.height*op.count; tib += op.count*2*Math.ceil(op.height/MODULE_HEIGHT); } }
            let extHor=0, extVer=0, intHor=0, intVer=0, extCorners=0, intCorners=0, tWalls=Number(d.tWalls)||0;
            if (d.mode === 'all25') { intHor = safeEval(d.intHor); intVer = safeEval(d.intVer); intCorners = Number(d.intCorners)||0; }
            else { extHor = safeEval(d.extHor); extVer = safeEval(d.extVer); extCorners = Number(d.extCorners)||0; intHor = safeEval(d.intHor); intVer = safeEval(d.intVer); intCorners = Number(d.intCorners)||0; }
            const extTL = extHor+extVer, intTL = intHor+intVer, tl = extTL+intTL; if (tl <= 0) return null;
            const St = tl*layers*MODULE_HEIGHT, Sn = Math.max(0, St-twa);
            const bl = Math.ceil(layers/2), sl = Math.floor(layers/2);
            const bc32 = extCorners*bl, sc32 = extCorners*sl;
            const bt32 = (d.mode==='mixed')?tWalls*bl:0, st32 = (d.mode==='mixed')?tWalls*sl:0;
            const as32 = bc32*MODULE_AREA['32'].大角+sc32*MODULE_AREA['32'].小角+bt32*MODULE_AREA['32'].大T+st32*MODULE_AREA['32'].小T;
            let bc25, sc25, bt25, st25;
            if (d.mode==='all25') { bc25=intCorners*bl; sc25=intCorners*sl; bt25=tWalls*bl; st25=tWalls*sl; }
            else { bc25=intCorners*bl; sc25=intCorners*sl; bt25=0; st25=0; }
            const as25 = bc25*MODULE_AREA['25'].大角+sc25*MODULE_AREA['25'].小角+bt25*MODULE_AREA['25'].大T+st25*MODULE_AREA['25'].小T;
            const Ssp = as32+as25; let Sst = Math.max(0, Sn-Ssp);
            const wc = Number(d.wallCount)||1; const M = Math.ceil(wc*layers/2);
            let c60 = M, rem = Sst-M*AREA_60; if (rem<0) rem=0;
            let c90 = Math.floor(rem/AREA_90), rem2 = rem-c90*AREA_90;
            if (rem2>1e-6) c60 += Math.ceil(rem2/AREA_60);
            const aStr = c90*AREA_90+c60*AREA_60;
            const r32 = tl>0?extTL/tl:0;
            const aS32 = aStr*r32, aS25 = aStr-aS32;
            const a32 = as32+aS32, a25 = as25+aS25;
            const c90_32 = Math.round(c90*r32), c90_25 = c90-c90_32;
            const c60_32 = Math.round(c60*r32), c60_25 = c60-c60_32;
            const i32 = Math.round(tib*r32), i25 = tib-i32;
            const tC = extCorners+intCorners;
            const cH = tC*6, tH = tWalls*9, wH = Math.ceil(tl*layers/3);
            return { layers, totalLength:tl, S_net:Sn, count90:c90, count60:c60, count90_25:c90_25, count90_32:c90_32, count60_25:c60_25, count60_32:c60_32, bigCorner32:bc32, smallCorner32:sc32, bigT32:bt32, smallT32:st32, bigCorner25:bc25, smallCorner25:sc25, bigT25:bt25, smallT25:st25, insert32:i32, insert25:i25, totalHooks:cH+tH+wH, area32:a32, area25:a25 };
        }

        function calcFloorRebar(f, mod) {
            if (!mod) return { lenHoriz:0, lenVert:0, horizDia:10, vertDia:12 };
            const d = floorData[f], ops = d.openings;
            let tww = 0; for (let op of ops) tww += (op.width||0)*(op.count||0);
            const H = Number(d.height), vd = d.wallVertDia||12, hd = d.wallHorizDia||10;
            const hLen = mod.layers*(mod.totalLength-tww);

        function calcColumnRebar(d) {

        function calcRoofRebar(len, wid, bd, td, sp) {
            if (len<=0||wid<=0) return { lenBottom:0, lenTop:0, bottomDia:bd, topDia:td, spacing:sp };

            const barsWid = Math.ceil(len/sm)+1;
            const lenBottom = (barsLen*len + barsWid*wid)*2;
            const lenTop = (barsLen*len + barsWid*wid)*2;

        }

        function calcSingleBeamRebar(b) {
            if (b.len<=0) return { mainLen:0, secLen:0, stirrupLen:0, mainDia:b.mainDia||22, secDia:b.secDia||18, stirrupDia:b.stirrupDia||6, stirrupCount:0 };
            const cnt = Math.ceil(b.len/((b.stirrupSpacing||200)/1000))+1;
            const mainLen = b.len*(b.mainCount||3);
            const secLen = b.len*(b.secCount||2);

            return { mainLen, secLen, stirrupLen, mainDia:b.mainDia||22, secDia:b.secDia||18, stirrupDia:b.stirrupDia||6, stirrupCount:cnt };
        }

        function ton(d, len) { return len*theoreticalKgPerM(d)/1000; }

        function calculateAll() {
            for (let f of [1,2]) collectFloorInputs(f);
            const p25 = parseFloat(priceInputs.module25.value)||0, p32 = parseFloat(priceInputs.module32.value)||0;
            const pI25 = parseFloat(priceInputs.insert25.value)||0, pI32 = parseFloat(priceInputs.insert32.value)||0;
            const pH = parseFloat(priceInputs.hook.value)||0, pC = parseFloat(priceInputs.concrete.value)||0;
            const pRebar = parseFloat(priceInputs.rebar.value)||0;

            const fr = { 1:{}, 2:{} };
            let tA25=0, tA32=0, tI25=0, tI32=0, tH=0, tWC=0, tRC=0, tBC=0, tIC=0, tSC=0;
            let rebarTons = {};
            let totalMod25 = { area:0, c90:0, c60:0, big:0, small:0, bT:0, sT:0, blk:0 };
            let totalMod32 = { area:0, c90:0, c60:0, big:0, small:0, bT:0, sT:0, blk:0 };

                const mod = calcFloorModules(f);
                const beams = d.beams || [];
                let bC=0, bP=0;
                let rLen = safeEval(d.roofLengthExpr), rWid = safeEval(d.roofWidthExpr);

                let iA = safeEval(d.insulAreaExpr), iV=0, iCost=0, iBlk=0;
                let wC=0, wR={ lenHoriz:0, lenVert:0, horizDia:10, vertDia:12 };
                let cR={ mainLen:0, stirrupLen:0, mainDia:12, stirrupDia:6, stirrupCount:0 };

                if (mod) {

                    wC += mod.count90_25*cv25['90直板']+mod.count60_25*cv25['60直板']+mod.bigCorner25*cv25['大角']+mod.smallCorner25*cv25['小角']+mod.bigT25*cv25['大T']+mod.smallT25*cv25['小T'];
                    wC += mod.count90_32*cv32['90直板']+mod.count60_32*cv32['60直板']+mod.bigCorner32*cv32['大角']+mod.smallCorner32*cv32['小角']+mod.bigT32*cv32['大T']+mod.smallT32*cv32['小T'];
                    fr[f] = {
                        a25:mod.area25, a32:mod.area32,

                        b25:mod.bigCorner25, s25:mod.smallCorner25, bt25:mod.bigT25, st25:mod.smallT25,

            let html = '';

        function saveToLocal() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                prices: { module25:priceInputs.module25.value, module32:priceInputs.module32.value, insert25:priceInputs.insert25.value, insert32:priceInputs.insert32.value, hook:priceInputs.hook.value, concrete:priceInputs.concrete.value, rebar:priceInputs.rebar.value },
                floors: floorData
            }));
        }
        function loadFromLocal() {
            const raw = localStorage.getItem(STORAGE_KEY); if (!raw) return;
            try {
                const saved = JSON.parse(raw);
                if (saved.prices) { for (let k in saved.prices) { if (priceInputs[k]) priceInputs[k].value = saved.prices[k]; } }
                if (saved.floors) { for (let f of [1,2]) if (saved.floors[f]) floorData[f] = { ...floorData[f], ...saved.floors[f] }; }
            } catch (e) {}
        }
        function init() {
            loadFromLocal();
            renderFloorPanel(1); renderFloorPanel(2); renderOpenings(1); renderOpenings(2); renderBeams(1); renderBeams(2);
            $('clearMaterialPrice').addEventListener('click', clearMaterialPrice);
            $('clearFloor1').addEventListener('click', () => clearFloor(1));
            $('clearFloor2').addEventListener('click', () => clearFloor(2));
            document.querySelectorAll('.floor-tab').forEach(btn => btn.addEventListener('click', function() {
                const f = this.dataset.floor;
                document.querySelectorAll('.floor-tab').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                $('floor1Panel').classList.toggle('active-panel', f==='1');
                $('floor2Panel').classList.toggle('active-panel', f==='2');
            }));
            document.querySelectorAll('input, select').forEach(el => {
                if (el.closest('.floor-panel')) return;
                el.addEventListener('input', () => { saveToLocal(); calculateAll(); });
                if (el.type === 'checkbox') el.addEventListener('change', () => { saveToLocal(); calculateAll(); });
            });
            calculateAll();
        }
        init();
    })();
</script>
