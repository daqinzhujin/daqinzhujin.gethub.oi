<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>模块房综合计算器</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, -apple-system, 'Microsoft YaHei', sans-serif; }
        body { background: #eef2f7; padding: 16px; font-size: 18px; color: #1e293b; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .container { background: white; border-radius: 10px; padding: 22px; box-shadow: 0 4px 18px rgba(15,23,42,0.08); width: 100%; max-width: 1320px; margin: 0 auto; }
        .page-head { border-bottom: 1px solid #e2e8f0; padding-bottom: 14px; margin-bottom: 16px; }
        h1 { font-size: 1.8rem; color: #172033; font-weight: 700; margin-bottom: 6px; }
        .subtitle { color: #64748b; font-size: 0.95rem; line-height: 1.6; }
        .workflow { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
        .workflow span { background:#f8fafc; border:1px solid #dbe4ee; border-radius:999px; padding:6px 12px; color:#334155; font-size:0.82rem; font-weight:600; }
        .entry-mode-bar { display:flex; justify-content:space-between; align-items:center; gap:16px; background:#f8fafc; border:1px solid #dbe4ee; border-radius:8px; padding:12px 14px; margin-bottom:16px; }
        .entry-mode-copy { min-width:220px; }
        .entry-mode-title { font-size:0.9rem; font-weight:800; color:#1e293b; }
        .entry-mode-note { color:#64748b; font-size:0.76rem; margin-top:3px; }
        .segmented { display:inline-flex; gap:3px; padding:3px; background:#e2e8f0; border-radius:7px; flex-shrink:0; }
        .segmented button { border:0; background:transparent; color:#475569; border-radius:5px; padding:8px 14px; font-size:0.84rem; font-weight:700; cursor:pointer; }
        .segmented button.active { background:#fff; color:#1d4ed8; box-shadow:0 1px 4px rgba(15,23,42,0.12); }
        .app-mode-quick .precision-only { display:none !important; }
        .app-mode-quick .drawing-only, .app-mode-drawing .quick-only { display:none !important; }
        .plan-builder { background:#fff; border:1px solid #dbe4ee; border-radius:8px; overflow:hidden; }
        .plan-builder-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 14px; background:#f1f5f9; border-bottom:1px solid #dbe4ee; }
        .plan-builder-title { color:#172033; font-size:0.98rem; font-weight:800; }
        .plan-builder-status { color:#166534; font-size:0.76rem; font-weight:700; }
        .plan-band { padding:14px; border-bottom:1px solid #e2e8f0; }
        .plan-band:last-child { border-bottom:0; }
        .plan-band-title { color:#334155; font-size:0.82rem; font-weight:800; margin-bottom:10px; }
        .plan-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px 12px; }
        .plan-grid .input-group { margin-bottom:0; }
        .scheme-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
        .scheme-block { border:1px solid #dbe4ee; border-radius:7px; padding:11px; background:#f8fafc; }
        .scheme-title { color:#1e3a5f; font-size:0.84rem; font-weight:800; margin-bottom:9px; }
        .scheme-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
        .scheme-fields .input-group { margin-bottom:0; }
        .scheme-fields .input-group:only-child { grid-column:1 / -1; }
        .generate-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; background:#f8fafc; }
        .btn-primary { border:0; border-radius:6px; background:#2563eb; color:#fff; padding:10px 18px; font-weight:800; font-size:0.9rem; cursor:pointer; }
        .btn-primary:hover { background:#1d4ed8; }
        .generate-note { color:#64748b; font-size:0.76rem; line-height:1.45; }
        .settings-details { border-top:1px solid #dbe4ee; margin-top:12px; padding-top:10px; }
        .settings-details summary, .task-details > summary, .batch-entry summary { cursor:pointer; list-style:none; }
        .settings-details summary::-webkit-details-marker, .task-details > summary::-webkit-details-marker, .batch-entry summary::-webkit-details-marker { display:none; }
        .settings-details summary { font-weight:800; color:#1e3a5f; padding:4px 0; }
        .settings-details summary::after, .batch-entry summary::after { content:'展开'; float:right; color:#64748b; font-size:0.75rem; font-weight:600; }
        .settings-details[open] summary::after, .batch-entry[open] summary::after { content:'收起'; }
        .input-method { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; background:#fff; border:1px solid #dbe4ee; border-radius:7px; margin-bottom:12px; }
        .input-method-title { font-size:0.84rem; font-weight:800; color:#334155; }
        .input-method .radio-group { margin:0; gap:14px; }
        .floor-data-status { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px; }
        .floor-data-status span { background:#eff6ff; color:#1e40af; border:1px solid #bfdbfe; border-radius:5px; padding:4px 8px; font-size:0.74rem; font-weight:700; }
        .task-details { display:block; }
        .task-details:not([open]) > :not(summary) { display:none; }
        .task-details > summary { font-weight:800; color:#1e3a5f; display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .task-details > summary::after { content:'+'; color:#64748b; font-size:1.2rem; line-height:1; }
        .task-details[open] > summary::after { content:'−'; }
        .task-count { margin-left:auto; color:#64748b; background:#e2e8f0; border-radius:5px; padding:3px 7px; font-size:0.72rem; font-weight:700; }
        .batch-entry { margin:10px 0; border-top:1px dashed #cbd5e1; padding-top:8px; }
        .batch-entry summary { color:#475569; font-size:0.8rem; font-weight:700; padding:3px 0 8px; }
        .section { background: #f8fafc; border-radius: 8px; padding: 18px; margin-bottom: 16px; border: 1px solid #e2e8f0; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
        .section-title { font-size: 1.08rem; font-weight: 700; color: #1e3a5f; display: flex; align-items: center; gap: 8px; }
        .section-title::before { content: ''; display: inline-block; width: 4px; height: 20px; background: #2563eb; border-radius: 2px; }
        .btn-clear { background: #fff; border: 1px solid #cbd5e1; color: #475569; border-radius: 6px; padding: 7px 12px; font-size: 0.82rem; cursor: pointer; transition: 0.2s; }
        .btn-clear:hover { background: #fee2e2; border-color: #f87171; color: #b91c1c; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 12px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 12px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 8px; }
        .input-group { margin-bottom: 10px; }
        label { display: block; font-weight: 500; color: #4a5568; margin-bottom: 6px; font-size: 0.85rem; }
        input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 0.9rem; background: #f8fafc; outline: none; transition: 0.2s; }
        textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
        input:focus, select:focus, textarea:focus { border-color: #4285f4; background: white; box-shadow: 0 0 0 3px rgba(66,133,244,0.12); }
        .radio-group { display: flex; gap: 20px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .radio-group label { display: flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer; font-size: 0.95rem; }
        .radio-group input[type="radio"] { width: auto; accent-color: #4285f4; }
        .floor-tabs { display: flex; gap: 10px; margin-bottom: 16px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
        .floor-tab { background: #e2e8f0; border: none; padding: 10px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
        .floor-tab.active { background: #4285f4; color: white; }
        .floor-panel { display: none; }
        .floor-panel.active-panel { display: block; }
        .checkbox-row { margin: 10px 0; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .checkbox-row input[type="checkbox"] { width: auto; accent-color: #4285f4; }
        .beam-section, .roof-panel, .plate-panel, .rebar-panel, .column-panel { background: #f1f5f9; border-radius: 8px; padding: 14px; margin-top: 14px; border: 1px solid #e2e8f0; }
        .result-card { background: white; border-radius: 8px; padding: 22px; margin-top: 12px; border: 1px solid #dbe4ee; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
        .result-title { font-size: 1.22rem; font-weight: 700; color: #172033; margin-bottom: 12px; }
        .result-actions { display:flex; gap:8px; justify-content:flex-start; flex-wrap:wrap; margin:0 0 14px; }
        .result-actions .btn-clear:hover { background:#e0f2fe; border-color:#38bdf8; color:#075985; }
        .result-section-title { font-size: 1.1rem; font-weight: 600; color: #1e3a5f; margin: 14px 0 8px; padding-bottom: 6px; border-bottom: 1px solid #e2e8f0; }
        .result-subtitle { font-weight: 600; color: #475569; margin: 10px 0 4px; font-size: 0.95rem; }
        .result-summary-grid { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px; margin:10px 0 16px; }
        .summary-tile { background:#f8fafc; border:1px solid #dbe4ee; border-radius:8px; padding:12px; min-height:86px; }
        .summary-tile .tile-label { color:#64748b; font-size:0.82rem; font-weight:700; margin-bottom:6px; }
        .summary-tile .tile-value { color:#0f172a; font-size:1.35rem; font-weight:800; line-height:1.2; }
        .summary-tile .tile-note { color:#64748b; font-size:0.76rem; margin-top:6px; line-height:1.35; }
        .result-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; align-items:start; margin-bottom:12px; }
        .result-block { background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:12px; }
        .result-block.wide { grid-column:1 / -1; }
        .result-block-title { color:#172033; font-weight:800; font-size:0.98rem; margin-bottom:8px; padding-bottom:7px; border-bottom:1px solid #e2e8f0; }
        .metric-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:7px; }
        .metric { display:flex; justify-content:space-between; align-items:center; gap:10px; background:#f8fafc; border:1px solid #eef2f7; border-radius:6px; padding:7px 9px; min-height:36px; }
        .metric .result-label { font-size:0.82rem; line-height:1.25; }
        .metric .result-value { font-size:0.9rem; text-align:right; line-height:1.25; }
        .metric.important { background:#eff6ff; border-color:#bfdbfe; }
        .metric.total-line { background:#ecfdf5; border-color:#bbf7d0; }
        .result-item { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; font-size: 0.95rem; border-bottom: 1px dashed #e2e8f0; }
        .result-item:last-child { border-bottom: none; }
        .result-label { color: #4a5568; }
        .result-value { font-weight: 600; color: #1e293b; }
        .price-value { font-weight: 700; color: #1e293b; }
        .total { font-weight: 700; border-top: 2px solid #4285f4; margin-top: 8px; padding-top: 8px; }
        .total-heavy { border-top: 3px solid #4285f4; margin-top: 10px; padding-top: 10px; }
        .subnote { font-size: 0.8rem; color: #718096; text-align: center; margin-top: 14px; }
        .note-box { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; border-radius:8px; padding:10px 12px; font-size:0.82rem; line-height:1.55; margin:10px 0 12px; }
        .table-wrap { overflow-x:auto; margin-top:10px; border:1px solid #e2e8f0; border-radius:8px; background:white; }
        .cut-table { width:100%; border-collapse:collapse; min-width:980px; font-size:0.82rem; }
        .cut-table th, .cut-table td { border-bottom:1px solid #e2e8f0; padding:8px 10px; text-align:right; white-space:nowrap; }
        .cut-table th { background:#f1f5f9; color:#334155; font-weight:700; }
        .cut-table td:first-child, .cut-table td:nth-child(2), .cut-table td:nth-child(3), .cut-table th:first-child, .cut-table th:nth-child(2), .cut-table th:nth-child(3) { text-align:left; }
        .cut-table tr:last-child td { border-bottom:none; }
        .cut-sheet { background:#fff; border:1px solid #cbd5e1; border-radius:6px; padding:18px 22px; margin:14px 0; color:#111827; }
        .cut-sheet-title { text-align:center; font-size:1.7rem; font-weight:800; letter-spacing:0; margin:0 0 8px; }
        .cut-title-lines { width:260px; height:24px; margin:0 auto 12px; border-top:1px solid #111827; border-bottom:1px solid #111827; }
        .cut-meta { display:grid; grid-template-columns:1fr 280px; gap:18px; margin:8px 0 12px; font-size:1rem; }
        .cut-meta-line { display:flex; align-items:flex-end; gap:8px; min-width:0; }
        .cut-meta-label { white-space:nowrap; color:#111827; }
        .cut-meta-value { flex:1; min-height:26px; border-bottom:1px solid #9ca3af; padding:0 10px 3px; color:#111827; }
        .cut-batch-table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:0.86rem; }
        .cut-batch-table th, .cut-batch-table td { border:1px solid #111827; padding:7px 6px; text-align:center; vertical-align:middle; color:#111827; }
        .cut-batch-table th { font-weight:700; background:#fff; }
        .cut-batch-table .component-row td { text-align:left; height:32px; font-weight:600; }
        .cut-batch-table .num { text-align:center; }
        .cut-batch-table .remark { text-align:left; line-height:1.35; }
        .bar-sketch { display:block; width:100%; max-width:220px; height:52px; margin:0 auto; overflow:visible; }
        .bar-sketch text { fill:#111827; font-size:12px; text-anchor:middle; dominant-baseline:middle; }
        .bar-sketch .bar-stroke { stroke:#111827; stroke-width:3; fill:none; stroke-linecap:square; stroke-linejoin:miter; }
        .cut-sheet-footer { display:grid; grid-template-columns:1fr 1fr 120px; gap:24px; align-items:end; margin-top:18px; font-size:0.95rem; }
        .cut-sign-line { display:inline-block; width:210px; border-bottom:1px solid #9ca3af; height:22px; vertical-align:bottom; }
        .cut-page-no { text-align:right; white-space:nowrap; }
        .cut-summary-grid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; margin:12px 0; }
        .cut-summary-card { border:1px solid #111827; padding:8px; min-height:66px; }
        .cut-summary-card b { display:block; font-size:1rem; margin-bottom:4px; }
        .opening-row, .beam-row, .wall-row, .column-row, .slabbar-row, .detailbar-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; background: white; padding: 8px; border-radius: 8px; flex-wrap: wrap; border: 1px solid #e2e8f0; }
        .beam-row input { flex: 1; min-width: 45px; margin: 0; font-size: 0.8rem; padding: 6px; }
        .beam-row, .column-row { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); align-items:end; padding:12px; gap:9px; }
        .compact-field { display:block; min-width:0; margin:0; }
        .compact-field span { display:block; color:#64748b; font-size:0.7rem; font-weight:700; margin-bottom:4px; }
        .compact-field input, .compact-field select { width:100% !important; min-width:0; margin:0; padding:7px 8px; border-radius:6px; font-size:0.8rem; }
        .beam-row .btn-small, .column-row .btn-small { justify-self:end; align-self:end; }
        .slabbar-row input, .detailbar-row input, .detailbar-row select { min-width:48px; margin:0; font-size:0.78rem; padding:6px; }
        .beam-header, .opening-header, .wall-header, .column-header, .slabbar-header, .detailbar-header { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; font-size: 0.7rem; color: #64748b; font-weight: 600; padding: 0 4px; }
        .beam-header span, .opening-header span, .wall-header span, .column-header span, .slabbar-header span, .detailbar-header span { text-align: center; }
        .advanced-details { margin-top:12px; border-top:1px solid #cbd5e1; padding-top:10px; }
        .advanced-details summary { cursor:pointer; font-weight:700; color:#1e3a5f; margin-bottom:10px; }
        .btn-small { background: #dc2626; border: none; border-radius: 6px; padding: 6px 12px; color: white; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
        .btn-small.add { background: #34a853; }
        .rebar-print-section { margin-top: 18px; padding-top: 14px; border-top: 3px solid #1e293b; }
        .rebar-print-section .result-subtitle:first-child { color:#111827; font-size:1.08rem; }
        @media print {
            body { background:#fff; padding:0; }
            .container { box-shadow:none; border-radius:0; max-width:none; padding:12px; }
            .page-head, .entry-mode-bar, .section, .result-actions, .subnote { display:none !important; }
            .result-card { border:none; box-shadow:none; padding:0; }
            .result-title { margin-bottom:8px; }
            .table-wrap { overflow:visible; border:1px solid #cbd5e1; }
            .cut-table { min-width:0; font-size:10px; }
            .cut-table th, .cut-table td { padding:4px 5px; white-space:normal; }
            .cut-sheet { border:none; border-radius:0; padding:0; margin:0; page-break-after:always; }
            .cut-sheet:last-child { page-break-after:auto; }
            .cut-batch-table { font-size:10px; }
            .cut-batch-table th, .cut-batch-table td { padding:4px 5px; }
            .bar-sketch { max-width:190px; height:48px; }
            .cut-summary-grid { grid-template-columns:repeat(3, minmax(0, 1fr)); }
        }
        @media (max-width: 800px) {
            .grid-2, .grid-3, .grid-4, .result-summary-grid, .result-grid, .metric-grid { grid-template-columns: 1fr; }
            .beam-header, .opening-header, .wall-header, .column-header, .slabbar-header, .detailbar-header { display:none; }
            .result-card, #resultContent { min-width:0; }
            .rebar-print-section { max-width:100%; overflow-x:auto; }
            .rebar-print-section .cut-sheet { min-width:610px; }
            .container { padding: 16px; }
            body { font-size: 16px; }
            .entry-mode-bar, .input-method { align-items:stretch; flex-direction:column; }
            .segmented { width:100%; }
            .segmented button { flex:1; padding-left:8px; padding-right:8px; }
            .plan-grid, .scheme-grid, .scheme-fields { grid-template-columns:1fr; }
            .generate-bar { align-items:stretch; flex-direction:column; }
            .beam-row, .column-row { grid-template-columns:repeat(2, minmax(0, 1fr)); }

</head>
<body>
<div class="container" id="appContainer">
    <div class="page-head">
        <h1>模块房综合计算器</h1>
        <div class="subtitle">按施工图填写墙体、构造柱、梁、现浇板和门窗洞口，自动生成模块、混凝土和钢筋下料单。</div>
        <div class="workflow">
            <span>1. 填写墙体尺寸</span>
            <span>2. 填写梁柱板及洞口</span>
            <span>3. 查看并打印下料单</span>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <span class="section-title">1. 工程信息与单价</span>
            <button class="btn-clear" id="clearMaterialPrice">清空单价</button>
        </div>
        <div class="grid-2">
            <div class="input-group"><label>25模块单价 (元/㎡)</label><input type="number" id="priceModule25" value="55" step="1"></div>
            <div class="input-group"><label>32模块单价 (元/㎡)</label><input type="number" id="priceModule32" value="65" step="1"></div>
            <div class="input-group"><label>25洞口插板单价 (元/块)</label><input type="number" id="priceInsert25" value="10"></div>
            <div class="input-group"><label>32洞口插板单价 (元/块)</label><input type="number" id="priceInsert32" value="10"></div>
            <div class="input-group"><label>钢丝勾单价 (元/个)</label><input type="number" id="priceHook" value="0.5" step="0.1"></div>
            <div class="input-group"><label>混凝土单价 (元/m³)</label><input type="number" id="priceConcrete" value="500" step="10"></div>
        </div>
        <div class="section-title" style="margin-top:12px;">钢筋单价</div>
        <div class="grid-2">
            <div class="input-group"><label>统一钢筋单价 (元/吨)</label><input type="number" id="priceRebar" step="10" value="3000"></div>
        </div>
        <div class="grid-2">
            <div class="input-group"><label>工程名称（打印下料单）</label><input type="text" id="projectName" placeholder="例如：乾县民房"></div>
            <div class="input-group"><label>施工部位（打印下料单）</label><input type="text" id="rebarWorkPart" value="钢筋量统计" placeholder="例如：2层钢筋量统计"></div>
        </div>
        <div class="section-title" style="margin-top:12px;">钢筋采购参数</div>
        <div class="grid-2">
            <div class="input-group"><label>Φ12及以上整根长度 (m)</label><input type="number" id="cutStockLen" step="0.1" value="9"></div>
            <div class="input-group"><label>损耗率 (%)</label><input type="number" id="cutWasteRate" step="0.5" value="3"></div>
        </div>
        <div class="note-box">钢筋重量按理论米重计算；梁柱箍筋保护层在每个构件中填写。采购规格由采购时另行确认。</div>
    </div>

    <div class="section">
        <div class="section-header">
            <span class="section-title">2. 平面尺寸与配筋</span>
            <span>

        function calcFloorModules(f) {

            for (let op of openings) {

            const bl = Math.ceil(layers/2), sl = Math.floor(layers/2);

        function getWallRebarRuns(d, mod) {
            const runs = [];

                count = Math.max(0, parseInt(count)||0);

                    name:count > 1 ? `${name}-${i+1}` : name,
                    baseName:name,
                    type,
                    length:len,
                    openings:[],
                    openingLoad:0
                });
            };
            if (d.wallInputMode === 'detail' && d.walls && d.walls.length) {
                d.walls.forEach((w, idx) => {
                    const type = d.mode === 'all25' ? '25' : (w.type === '32' ? '32' : '25');
                    pushRuns(w.name||`墙段${idx+1}`, type, safeEval(String(w.len||'')), parseInt(w.count)||1);

            }
            let extTL=0, intTL=0;
            if (d.mode === 'all25') intTL = safeEval(d.intHor)+safeEval(d.intVer);
            else {
                extTL = safeEval(d.extHor)+safeEval(d.extVer);
                intTL = safeEval(d.intHor)+safeEval(d.intVer);

            if (split.int > 0) pushRuns('25墙段', '25', intTL/split.int, split.int);

        }

        function openingVerticalRange(op, H) {
            const rawSill = op.sill;
            const sill = Number(rawSill);
            const hasSill = rawSill !== '' && rawSill !== null && rawSill !== undefined && Number.isFinite(sill) && sill >= 0;
            const isDoor = /^M/i.test(op.name||'') || /门/.test(op.name||'');
            const bottom = hasSill ? sill/1000 : 0;
            return {
                bottom:Math.max(0, Math.min(H, bottom)),
                top:Math.max(0, Math.min(H, bottom+(Number(op.height)||0))),
                assumedFloor:!hasSill && !isDoor
            };
        }

        function assignOpeningsToWallRuns(d, runs) {
            const normalized = text => String(text||'').trim().toLowerCase();
            (d.openings||[]).forEach(op => {
                const count = Math.max(0, parseInt(op.count)||0);
                for (let i=0; i<count; i++) {
                    let candidates = runs;
                    const targetName = normalized(op.wallName);
                    if (targetName) {
                        const named = runs.filter(r => normalized(r.name)===targetName || normalized(r.baseName)===targetName);
                        if (named.length) candidates = named;
                    } else if (op.wallType === '25' || op.wallType === '32') {
                        const typed = runs.filter(r => r.type===op.wallType);
                        if (typed.length) candidates = typed;
                    }
                    if (!candidates.length) continue;
                    const run = candidates.slice().sort((a,b) =>
                        (a.openingLoad/Math.max(a.length,0.01))-(b.openingLoad/Math.max(b.length,0.01)) || b.length-a.length
                    )[0];
                    const rawOffset = Number(op.offset);
                    const hasOffset = op.offset !== '' && op.offset !== null && op.offset !== undefined && Number.isFinite(rawOffset) && rawOffset >= 0 && count===1;
                    run.openings.push({ ...op, count:1, offset:hasOffset ? rawOffset : '', estimatedPosition:!hasOffset });
                    run.openingLoad += Number(op.width)||0;
                }
            });
        }

        function mergeIntervals(intervals, limit) {
            const sorted = intervals.map(v => [Math.max(0,v[0]), Math.min(limit,v[1])]).filter(v => v[1]>v[0]).sort((a,b)=>a[0]-b[0]);
            const merged = [];
            sorted.forEach(v => {
                const last = merged[merged.length-1];
                if (last && v[0] <= last[1]+1e-6) last[1] = Math.max(last[1],v[1]);
                else merged.push(v.slice());
            });
            return merged;
        }

        function calcFloorRebar(f, mod) {
            if (!mod) return { lenHoriz:0, lenVert:0, horizDia:10, vertDia:12 };
            const d = floorData[f], H = Number(d.height), vd = d.wallVertDia||12, hd = d.wallHorizDia||10;
            const spacing = MODULE_HEIGHT;
            const runs = getWallRebarRuns(d, mod);
            assignOpeningsToWallRuns(d, runs);
            const horizMap = new Map(), vertMap = new Map();
            const addGroup = (map, count, len, label, estimated=false) => {
                count = Math.max(0, Math.ceil(Number(count)||0));
                len = Math.max(0, Number(len)||0);
                if (count<=0 || len<=0.05) return;
                const key = `${label}|${len.toFixed(3)}|${estimated?'1':'0'}`;
                const item = map.get(key) || { count:0, baseLen:len, label, estimated };
                item.count += count;

                unknownSillCount += openingRanges.filter(v=>v.assumedFloor).length;
                for (let i=0; i<levelCount; i++) {

                            if (L-start>0.05) lengths.push(L-start);

                            estimated=true;
                        }

                const barCuts = Array.from({length:vBarCount},()=>[]);
                let estimateCursor=1;

                    const offset = Number(v.op.offset);

                    } else {

            const vertGroups = Array.from(vertMap.values()).sort((a,b)=>a.label.localeCompare(b.label,'zh-CN') || b.baseLen-a.baseLen);

                lenVert:vLen+topLen,
                horizDia:hd,
                vertDia:vd,
                horizCount:horizGroups.reduce((sum,g)=>sum+g.count,0),
                horizBaseLen:horizGroups.length ? hLen/Math.max(1,horizGroups.reduce((sum,g)=>sum+g.count,0)) : 0,

                vertBaseLen:H,
                openingTopLen:topLen,

        }

        function getColumnSpecs(d) {

                        mainDia:parseInt(c.mainDia)||12, mainCount:parseInt(c.mainCount)||4,
                        mainAnchorD:Math.max(0,numberOr(c.mainAnchorD,12)), mainAnchorEnds:normalizeAnchorEnds(c.mainAnchorEnds,2),
                        stirrupDia:parseInt(c.stirrupDia)||6,
                        stirrupSpacing:parseInt(c.stirrupSpacing)||200,
                        stirrupHookD:Math.max(1,parseFloat(c.stirrupHookD)||10), stirrupMinHook:Math.max(1,parseFloat(c.stirrupMinHook)||75)
                    });
                });
            }
            return specs;
        }

        function calcColumnRebar(d, params=getCutParams()) {
            const specs = getColumnSpecs(d);
            const res = { mainLen:0, stirrupLen:0, mainDia:12, stirrupDia:6, stirrupCount:0, concreteVolume:0, items:[] };
            specs.forEach((s, idx) => {
                const stirrupDia=s.stirrupDia||6;
                const cw = s.width/1000, ch = s.depth/1000;
                const sCnt = Math.ceil(s.height/((s.stirrupSpacing||200)/1000))+1;
                const mainLen = s.count*s.mainCount*s.height;
                const stirrupLen = s.count*sCnt*(stirrupBaseLen(cw, ch, stirrupDia, s.cover)+stirrupHookLen(stirrupDia, s.stirrupHookD, s.stirrupMinHook));
                const concreteVolume = s.count*cw*ch*s.height;
                res.mainLen += mainLen;
                res.stirrupLen += stirrupLen;
                res.stirrupCount += s.count*sCnt;
                res.concreteVolume += concreteVolume;
                if (idx===0) { res.mainDia=s.mainDia; res.stirrupDia=stirrupDia; }
                res.items.push({ ...s, stirrupDia, stirrupCount:s.count*sCnt, stirrupPerColumn:sCnt, concreteVolume });
            });
            return res;
        }

        function calcRoofRebar(area, bd, td, sp) {
            if (area<=0) return { lenBottom:0, lenTop:0, bottomDia:bd, topDia:td, spacing:sp, areaEstimate:true };
            const sm = sp/1000;
            const side = Math.sqrt(area);
            const barsLen = Math.ceil(side/sm)+1;
            const barsWid = barsLen;
            const lenBottom = barsLen*side + barsWid*side;
            const lenTop = lenBottom;
            return { lenBottom, lenTop, bottomDia:bd, topDia:td, spacing:sp, barsLen, barsWid, len:side, wid:side, area, areaEstimate:true };
        }

        function calcSingleBeamRebar(b, params=getCutParams()) {
            const stirrupDia = Number(b.stirrupDia)||6;
            if (b.len<=0) return { mainLen:0, secLen:0, stirrupLen:0, mainDia:b.mainDia||22, secDia:b.secDia||18, stirrupDia, stirrupCount:0 };
            const middleSpacing=Math.max(1,Number(b.stirrupSpacing)||200);
            const endSpacing=Math.max(0,Number(b.stirrupEndSpacing)||0);
            const endLength=Math.min(Math.max(0,Number(b.stirrupEndLength)||0),b.len/2);
            let cnt, stirrupSpacingText=`@${Math.round(middleSpacing)}`;
            if (endSpacing>0&&endLength>0) {
                const endIntervals=Math.ceil(endLength/(endSpacing/1000)-1e-9);
                const middleLength=Math.max(0,b.len-2*endLength);
                const middleIntervals=middleLength>1e-9?Math.ceil(middleLength/(middleSpacing/1000)-1e-9):0;
                cnt=2*endIntervals+middleIntervals+1;
                stirrupSpacingText=`@${Math.round(endSpacing)}/${Math.round(middleSpacing)}(2)`;
            } else cnt=Math.ceil(b.len/(middleSpacing/1000)-1e-9)+1;
            const mainLen = b.len*(b.mainCount||3);
            const secLen = b.len*(b.secCount||2);
            const stirrupLen = cnt*(stirrupBaseLen(b.wid||0.24, b.hgt||0.5, stirrupDia, b.cover??20)+stirrupHookLen(stirrupDia, b.stirrupHookD||10, b.stirrupMinHook||75));
            return { mainLen, secLen, stirrupLen, mainDia:b.mainDia||22, secDia:b.secDia||18, stirrupDia, stirrupCount:cnt, stirrupSpacingText };
        }

        function kgPerM(d) { return theoreticalKgPerM(d); }
        function ton(d, len, params) { return len*kgPerM(d, params)/1000; }

        function getCutParams() {
            const val = (id, fallback) => {
                const el = $(id);
                const n = el ? parseFloat(el.value) : fallback;
                return Number.isFinite(n) ? n : fallback;
            };
            return {
                stockLen: Math.max(0, val('cutStockLen', 9)),
                wasteRate: Math.max(0, val('cutWasteRate', 3))
            };
        }

        function hookLen(dia, multiple, ends=2) {
            return dia * multiple * ends / 1000;
        }

        function stirrupHookLen(dia, hookD=10, minHook=75, ends=2) {
            const straightPerEnd = Math.max(dia * hookD, minHook) / 1000;
            return straightPerEnd * ends;
        }

        function stirrupBaseLen(widthM, depthM, stirrupDia, cover=20) {
            const coverM = Math.max(0, Number(cover) || 0) / 1000;
            const w = Math.max(0.01, (widthM || 0) - 2 * coverM);
            const h = Math.max(0.01, (depthM || 0) - 2 * coverM);
            return 2 * (w + h);
        }

        function isMeterPurchase(dia) {
            return dia <= 10;
        }

        function purchaseRuleText(dia, params) {
            if (isMeterPurchase(dia)) return 'Φ10及以下按实际米数采购';
            return `Φ12及以上按${params.stockLen.toFixed(1)}m/根采购`;
        }

        function purchaseText(dia, len, stockCount, params) {
            if (isMeterPurchase(dia)) return `${len.toFixed(2)}m`;
            return `${stockCount} 根 × ${params.stockLen.toFixed(1)}m`;
        }

        function addCutItem(rows, params, item) {
            const count = Math.ceil(Number(item.count)||0);
            const dia = Number(item.dia)||0;
            const baseLen = Number(item.baseLen)||0;
            if (count <= 0 || dia <= 0 || baseLen <= 0) return null;
            const addLen = Math.max(0, Number(item.addLen)||0);
            const overrideLen = Math.max(0, Number(item.unitLenOverride)||0);
            const unitLen = overrideLen>0 ? overrideLen : baseLen+addLen;
            const totalLen = unitLen * count;
            const withWasteLen = totalLen * (1 + params.wasteRate/100);
            const weight = ton(dia, totalLen, params);
            const componentQty=Math.max(1,Math.ceil(Number(item.componentQty)||1));
            const unitCount=Math.max(1,Math.ceil(Number(item.unitCount)||(count/componentQty)));
            const anchorEnds=normalizeAnchorEnds(item.anchorEnds,addLen>0?2:0);
            const anchorPerEnd=anchorEnds>0?Math.max(0,numberOr(item.anchorPerEnd,addLen/anchorEnds)):0;
            const row = {
                floor:item.floor, part:item.part, name:item.name, dia, count,
                componentQty, unitCount,
                baseLen, addLen, anchorEnds, anchorPerEnd, unitLen, totalLen, withWasteLen, weight,
                spacing:item.spacing || '', spacingText:item.spacingText||'', stockCount:0, purchaseMode:isMeterPurchase(dia)?'meter':'stock', note:item.note || '',
                component:item.component||'', leftLeg:Math.max(0,Number(item.leftLeg)||0), rightLeg:Math.max(0,Number(item.rightLeg)||0), shapeSource:item.shapeSource||''
            };
            if (!isMeterPurchase(dia) && params.stockLen > 0) row.stockCount = planStockBars([row], dia, params).stock;
            rows.push(row);
            return row;
        }

        function addCutTon(rebarTons, row) {
            if (!row) return;
            rebarTons[row.dia] = (rebarTons[row.dia]||0) + row.weight;
        }

        function planStockBars(rows, dia, params) {
            const stockLen = Math.max(0, Number(params.stockLen)||0);
            if (stockLen<=0) return { stock:0, packedStock:0, netLen:0, requiredLen:0, overlengthCount:0, packingWaste:0 };
            const pieces=[];
            let netLen=0, overlengthCount=0;
            rows.filter(r=>Number(r.dia)===Number(dia)).forEach(r => {
                const count=Math.max(0,Math.ceil(Number(r.count)||0));
                const unitLen=Math.max(0,Number(r.unitLen)||0);
                netLen += unitLen*count;
                for (let i=0;i<count;i++) {
                    if (unitLen>stockLen+1e-9) overlengthCount++;
                    let remaining=unitLen;
                    while (remaining>stockLen+1e-9) { pieces.push(stockLen); remaining-=stockLen; }
                    if (remaining>1e-9) pieces.push(remaining);
                }
            });
            pieces.sort((a,b)=>b-a);
            const bins=[];
            pieces.forEach(len => {
                let best=-1, bestRemain=Infinity;
                for (let i=0;i<bins.length;i++) {
                    const next=bins[i]-len;
                    if (next>=-1e-9 && next<bestRemain) { best=i; bestRemain=next; }
                }
                if (best>=0) bins[best]=Math.max(0,bins[best]-len);
                else bins.push(Math.max(0,stockLen-len));
            });
            const requiredLen=netLen*(1+(Number(params.wasteRate)||0)/100);
            const stock=Math.max(bins.length,Math.ceil(requiredLen/stockLen-1e-9));
            return { stock, packedStock:bins.length, netLen, requiredLen, overlengthCount, packingWaste:Math.max(0,stock*stockLen-netLen) };
        }

        function summarizeRebarByDia(rows, params) {
            const sum = {};
            rows.forEach(r => {
                if (!sum[r.dia]) sum[r.dia] = { dia:r.dia, weight:0, netLen:0, len:0 };
                sum[r.dia].weight += r.weight;
                sum[r.dia].netLen += r.totalLen;
                sum[r.dia].len += r.withWasteLen;
            });
            return Object.keys(sum).map(Number).sort((a,b)=>a-b).map(dia => {
                const s = sum[dia];
                const plan = !isMeterPurchase(dia) ? planStockBars(rows,dia,params) : null;
                s.stock = plan ? plan.stock : 0;
                s.packedStock = plan ? plan.packedStock : 0;
                s.overlengthCount = plan ? plan.overlengthCount : 0;
                s.packingWaste = plan ? plan.packingWaste : 0;
                s.purchaseLen = isMeterPurchase(dia) ? s.len : (params.stockLen > 0 ? s.stock * params.stockLen : s.len);
                s.purchaseWeight = ton(dia, s.purchaseLen, params);
                return s;
            });
        }

        function buildCutListHtml(rows, params, pRebar) {
            if (!rows.length) return '<div class="result-subtitle">🔩 钢筋下料单</div><div class="subnote">暂无可生成的钢筋下料数据</div>';
            const summaries = summarizeRebarByDia(rows, params);
            let totalWeight = 0, totalLen = 0, totalWasteLen = 0;
            rows.forEach(r => {
                totalWeight += r.weight; totalLen += r.totalLen; totalWasteLen += r.withWasteLen;
            });
            let totalPurchaseLen = 0, totalPurchaseWeight = 0;
            summaries.forEach(s => {
                totalPurchaseLen += s.purchaseLen;
                totalPurchaseWeight += s.purchaseWeight;
            });
            let html = '<div class="result-subtitle">🔩 钢筋下料单（含端部锚固/弯钩估算）</div>';
            html += `<div class="subnote">构件重量按净下料长度计算，不含采购损耗；Φ10及以下按米数购买，Φ12及以上按 ${params.stockLen.toFixed(1)}m/根套料后采购，并另计 ${params.wasteRate.toFixed(1)}% 损耗储备。</div>`;
            html += '<div class="table-wrap"><table class="cut-table"><thead><tr><th>楼层</th><th>部位</th><th>名称</th><th>规格</th><th>根数</th><th>净长/根</th><th>端部锚固/弯钩</th><th>下料/根</th><th>合计长度</th><th>含损耗长度</th><th>重量</th><th>本行折算</th><th>备注</th></tr></thead><tbody>';
            rows.forEach(r => {
                const warn = (!isMeterPurchase(r.dia) && params.stockLen > 0 && r.unitLen > params.stockLen) ? '需接长' : r.note;
                html += `<tr><td>${r.floor}</td><td>${r.part}</td><td>${r.name}</td><td>Φ${r.dia}</td><td>${r.count}</td><td>${r.baseLen.toFixed(2)}m</td><td>${r.addLen.toFixed(2)}m</td><td>${r.unitLen.toFixed(2)}m</td><td>${r.totalLen.toFixed(2)}m</td><td>${r.withWasteLen.toFixed(2)}m</td><td>${r.weight.toFixed(3)}t</td><td>${purchaseText(r.dia, r.withWasteLen, r.stockCount, params)}</td><td>${warn}</td></tr>`;
            });
            html += '</tbody></table></div>';
            html += '<div class="result-subtitle">🔩 下料汇总（按直径）</div>';
            summaries.forEach(s => {
                const cost = s.purchaseWeight*pRebar;
                html += `<div class="result-item"><span class="result-label">Φ${s.dia}</span><span class="result-value">净长${s.netLen.toFixed(2)}m · 损耗后${s.len.toFixed(2)}m · 采购 ${purchaseText(s.dia, s.len, s.stock, params)} · 采购重量${s.purchaseWeight.toFixed(3)}t · <span class="price-value">￥${cost.toFixed(2)}</span></span></div>`;
            });
            html += `<div class="result-item total"><span class="result-label">钢筋采购总长度/重量</span><span class="result-value">${totalPurchaseLen.toFixed(2)}m · ${totalPurchaseWeight.toFixed(3)}t</span></div>`;
            html += `<div class="result-item"><span class="result-label">净下料长度/净理论重量</span><span class="result-value">${totalLen.toFixed(2)}m · ${totalWeight.toFixed(3)}t</span></div>`;
            return html;
        }

        function htmlSafe(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
            }[ch]));
        }

        function formatSheetDate() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
        }

        function getCutSheetMeta() {
            const project = $('projectName') ? $('projectName').value.trim() : '';
            const part = $('rebarWorkPart') ? $('rebarWorkPart').value.trim() : '';
            return {
                project: project || '未填写工程',
                part: part || '钢筋量统计',
                date: formatSheetDate()
            };
        }

        function lenMm(valueM) {
            return Math.round((Number(valueM) || 0) * 1000);
        }

        function spacingText(row) {
            if (row.spacingText) return row.spacingText;
            const sp = Number(row.spacing || 0);
            return sp > 0 ? `@${Math.round(sp)}` : '';
        }

        function rowCutLengthText(row, params) {
            const unitMm = lenMm(row.unitLen);
            const stockMm = lenMm(params.stockLen);
            if (!isMeterPurchase(row.dia) && stockMm > 0 && unitMm > stockMm) {
                const pieces = [];
                let remain = unitMm;
                while (remain > stockMm) {
                    pieces.push(stockMm);
                    remain -= stockMm;
                }
                if (remain > 0) pieces.push(remain);
                return pieces.join('/');
            }
            return String(unitMm);
        }

        function isStirrupRow(row) {
            return /箍筋/.test(row.name || '');
        }

        function addUniqueNote(notes, text) {
            if (text && !notes.includes(text)) notes.push(text);
        }

        function rowRemark(row, params) {
            const notes = [row.name];
            if (!isMeterPurchase(row.dia) && params.stockLen > 0 && row.unitLen > params.stockLen) notes.push('单根超9m，需接长复核');
            if (row.note) addUniqueNote(notes, row.note);
            const anchorEnds=normalizeAnchorEnds(row.anchorEnds,row.addLen>0?2:0);
            const perEndMm = lenMm(numberOr(row.anchorPerEnd,anchorEnds>0?(row.addLen||0)/anchorEnds:0));
            if (isStirrupRow(row)) {
                if (row.shapeSource==='manual-cut') addUniqueNote(notes,'箍筋图样示意，下料长度采用图纸/人工输入值');
                else addUniqueNote(notes, `135°弯钩，平直段≥${perEndMm}mm/端`);
            } else if (row.leftLeg>0 || row.rightLeg>0) {
                addUniqueNote(notes, `弯腿：左${lenMm(row.leftLeg)}mm、右${lenMm(row.rightLeg)}mm`);
                if (row.shapeSource==='manual-cut') addUniqueNote(notes,'下料长度采用图纸/人工输入值');
            } else if (anchorEnds > 0 && perEndMm > 0) {
                addUniqueNote(notes, `${anchorEnds===1?'一端':'两端'}直锚/伸入${perEndMm}mm/端，未默认画90°弯钩`);
            }
            return notes.join('；');
        }

        function rebarSketchHtml(row) {
            const main = lenMm(row.baseLen);
            const anchorEnds=normalizeAnchorEnds(row.anchorEnds,row.addLen>0?2:0);
            const hook = lenMm(numberOr(row.anchorPerEnd,anchorEnds>0?row.addLen/anchorEnds:0));
            if (isStirrupRow(row)) {
                return `<svg class="bar-sketch" viewBox="0 0 250 50" preserveAspectRatio="xMidYMid meet" aria-label="135度箍筋图样">
                    <path class="bar-stroke" d="M86 14 H174 V34 H78 V20 L92 34"></path>
                    <path class="bar-stroke" d="M174 14 L160 0"></path>
                    <text x="125" y="24">${lenMm(row.unitLen)}</text>
                    <text x="62" y="15">135°</text>
                    <text x="198" y="10">135°</text>
                    <text x="125" y="45">${row.shapeSource==='manual-cut'?`下料${lenMm(row.unitLen)}`:`平直≥${hook}`}</text>
                </svg>`;
            }
            const leftLeg=lenMm(row.leftLeg), rightLeg=lenMm(row.rightLeg);
            if (leftLeg>0||rightLeg>0) {
                const leftPath=leftLeg>0?'M45 35 V14':'M45 35';
                const rightPath=rightLeg>0?'M205 35 V14':'M205 35';
                return `<svg class="bar-sketch" viewBox="0 0 250 50" preserveAspectRatio="xMidYMid meet" aria-label="板筋弯折图样">
                    <path class="bar-stroke" d="${leftPath} M45 35 H205 ${rightPath}"></path>
                    <text x="125" y="18">${main}</text>
                    ${leftLeg>0?`<text x="25" y="24">${leftLeg}</text>`:''}
                    ${rightLeg>0?`<text x="225" y="24">${rightLeg}</text>`:''}
                </svg>`;
            }
            const hasHook = anchorEnds > 0 && row.addLen > 0.005;
            if (!hasHook) {
                return `<svg class="bar-sketch" viewBox="0 0 250 50" preserveAspectRatio="xMidYMid meet" aria-label="直筋图样">
                    <path class="bar-stroke" d="M45 28 H205"></path>
                    <text x="125" y="13">${main}</text>
                </svg>`;
            }
            if (anchorEnds===1) {
                return `<svg class="bar-sketch" viewBox="0 0 250 50" preserveAspectRatio="xMidYMid meet" aria-label="单端直锚钢筋图样">
                    <path class="bar-stroke" d="M45 30 H222"></path>
                    <path class="bar-stroke" d="M192 30 H222"></path>
                    <text x="125" y="13">${main}</text>
                    <text x="208" y="43">锚${hook}</text>
                </svg>`;
            }
            return `<svg class="bar-sketch" viewBox="0 0 250 50" preserveAspectRatio="xMidYMid meet" aria-label="双端直锚钢筋图样">
                    <path class="bar-stroke" d="M28 30 H222"></path>
                    <path class="bar-stroke" d="M28 30 H58"></path>
                    <path class="bar-stroke" d="M192 30 H222"></path>
                    <text x="125" y="13">${main}</text>
                    <text x="42" y="43">锚${hook}</text>
                    <text x="208" y="43">锚${hook}</text>
                </svg>`;
        }

        function groupCutRows(rows) {
            const order = [];
            const map = new Map();
            rows.forEach(row => {
                const component = rowComponentName(row);
                const key = `${row.floor}|${row.part}|${component}`;
                if (!map.has(key)) {
                    const group = { key, floor:row.floor || '', part:row.part || '', component, componentQty:row.componentQty||1, rows:[] };
                    map.set(key, group);
                    order.push(group);
                }
                map.get(key).rows.push(row);
            });
            return order;
        }

        function rowComponentName(row) {
            if (row.component) return row.component;
            const name = row.name || '';
            if (row.part === '梁') {
                const m = name.match(/^梁\d+/);
                return m ? m[0] : '梁';
            }
            if (row.part === '构造柱') return name.replace(/(主筋|箍筋).*$/, '') || '构造柱';
            if (row.part === '洞口') return name.replace(/上部加强筋.*$/, '洞口加强筋') || '洞口加强筋';
            if (row.part === '顶板') return '现浇板钢筋';
            if (row.part === '墙体') return '墙身剪力墙';
            return row.part || '钢筋';
        }

        function groupName(group) {
            const names = {
                '墙体':'墙身剪力墙',
                '洞口':'洞口加强筋',
                '构造柱':'墙内构造柱',
                '梁':'梁钢筋',
                '顶板':'现浇板钢筋'
            };
            const base = group.component || names[group.part] || group.part || '钢筋';
            const suffix = group.splitIndex ? `（续${group.splitIndex + 1}）` : '';
            return `${group.floor}${base}${suffix}`;
        }

        function groupPosition(group) {
            const text = {
                '墙体':'按墙体中心线汇总，已按门窗洞口和离地高度扣减',
                '洞口':'门窗洞口上部加强位置',
                '构造柱':'按手动录入的构造柱组别汇总',
                '梁':'梁构件汇总',
                '顶板':'现浇板双向钢筋；仅输入面积时按等面积正方形估算'
            };
            return text[group.part] || '自动汇总';
        }

        function groupWeightKg(group) {
            return group.rows.reduce((sum, row) => sum + row.weight * 1000, 0);
        }

        function cutSheetHeader(meta) {
            return `<div class="cut-sheet-title">钢筋配料单</div>
                <div class="cut-title-lines"></div>
                <div class="cut-meta">
                    <div class="cut-meta-line"><span class="cut-meta-label">工程名称：</span><span class="cut-meta-value">${htmlSafe(meta.project)}</span></div>
                    <div class="cut-meta-line"><span class="cut-meta-label">日期：</span><span class="cut-meta-value">${htmlSafe(meta.date)}</span></div>
                    <div class="cut-meta-line"><span class="cut-meta-label">施工部位：</span><span class="cut-meta-value">${htmlSafe(meta.part)}</span></div>

        function cutSheetFooter(pageNo, pageCount) {

                <div>翻样人/电话：<span class="cut-sign-line"></span></div>
                <div class="cut-page-no">第${pageNo}页&nbsp;&nbsp;共${pageCount}页</div>
            </div>`;
        }

        function cutDetailTable(groups, params) {
            let html = `<table class="cut-batch-table">
                <colgroup>
                    <col style="width:6%"><col style="width:8%"><col style="width:8%"><col style="width:28%">

        function buildCutListHtml(rows, params, pRebar) {
            if (!rows.length) return '<div class="result-subtitle">钢筋配料单</div><div class="subnote">暂无可生成的钢筋下料数据</div>';
            const meta = getCutSheetMeta();
            const maxLines = 22;
            const maxDetailLines = maxLines - 3;
            const groups = [];
            groupCutRows(rows).forEach(group => {
                if (group.rows.length <= maxDetailLines) {
                    groups.push(group);
                    return;
                }
                for (let i = 0; i < group.rows.length; i += maxDetailLines) {
                    groups.push({ ...group, rows:group.rows.slice(i, i + maxDetailLines), splitIndex:Math.floor(i / maxDetailLines) });
                }
            });
            const pages = [];
            let current = [], usedLines = 0;
            groups.forEach(group => {
                const lines = 3 + group.rows.length;
                if (current.length && usedLines + lines > maxLines) {
                    pages.push(current);
                    current = [];
                    usedLines = 0;
                }
                current.push(group);
                usedLines += lines;
            });
            if (current.length) pages.push(current);
            const pageCount = pages.length + 1;
            let html = '<div class="result-subtitle">钢筋配料单（打印版）</div>';
            html += `<div class="subnote">版式按样张生成：构件重量为净理论重量，不含损耗；Φ10及以下按米数采购，Φ12及以上按 ${params.stockLen.toFixed(1)}m原材进行同直径套料，再计采购损耗。</div>`;
            pages.forEach((pageGroups, idx) => {
                html += `<div class="cut-sheet">${cutSheetHeader(meta)}${cutDetailTable(pageGroups, params)}${cutSheetFooter(idx + 1, pageCount)}</div>`;
            });
            html += cutSummarySheet(rows, params, meta, pageCount, pageCount);
            return html;
        }

        function downloadCsv(filename, rows, label) {
            if (!rows || !rows.length) {
                alert(`${label}暂无可导出的数据，请先输入房屋参数。`);
                return;
            }
            const headers = Object.keys(rows[0]);
            const csv = [
                headers.map(csvCell).join(','),
                ...rows.map(row => headers.map(h => csvCell(row[h])).join(','))
            ].join('\r\n');
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function calculateAll() {
            for (let f of [1,2]) collectFloorInputs(f);
            for (let f of [1,2]) updateFloorCounters(f);
            const p25 = parseFloat(priceInputs.module25.value)||0, p32 = parseFloat(priceInputs.module32.value)||0;
            const pI25 = parseFloat(priceInputs.insert25.value)||0, pI32 = parseFloat(priceInputs.insert32.value)||0;
            const pH = parseFloat(priceInputs.hook.value)||0, pC = parseFloat(priceInputs.concrete.value)||0;
            const pRebar = parseFloat(priceInputs.rebar.value)||0;
            const cutParams = getCutParams();

            const fr = { 1:{}, 2:{} };
            let tA25=0, tA32=0, tI25=0, tI32=0, tMI25=0, tMI32=0, tOI25=0, tOI32=0, tH=0, tWC=0, tRC=0, tBC=0, tCC=0, tIC=0, tSC=0;
            let rebarTons = {}, rebarCutRows = [];
            let totalMod25 = { area:0, c90:0, c60:0, big:0, small:0, bT:0, sT:0, blk:0 };
            let totalMod32 = { area:0, c90:0, c60:0, big:0, small:0, bT:0, sT:0, blk:0 };

            for (let f of [1,2]) {
                const d = floorData[f];
                const mod = calcFloorModules(f);
                const beams = d.beams || [];
                const detailBars=d.detailBars||[];
                const replaceParts=new Set(detailBars.filter(bar=>bar.mode==='replace').map(bar=>detailPartValue(bar.part)));
                let bC=0, bP=0, colC=0;
                let rArea=Math.max(0,safeEval(d.roofAreaExpr));
                let rC=0, rR={ lenBottom:0, lenTop:0, bottomDia:12, topDia:10, spacing:200 };
                let iA = safeEval(d.insulAreaExpr), iV=0, iCost=0, iBlk=0;
                let wC=0, wR={ lenHoriz:0, lenVert:0, horizDia:10, vertDia:12 };
                let cR={ mainLen:0, stirrupLen:0, mainDia:12, stirrupDia:6, stirrupCount:0 };

                if (mod) {
                    wR = calcFloorRebar(f, mod);
                    const cv25 = cavityVolume['25'], cv32 = cavityVolume['32'];
                    wC += mod.count90_25*cv25['90直板']+mod.count60_25*cv25['60直板']+mod.bigCorner25*cv25['大角']+mod.smallCorner25*cv25['小角']+mod.bigT25*cv25['大T']+mod.smallT25*cv25['小T'];
                    wC += mod.count90_32*cv32['90直板']+mod.count60_32*cv32['60直板']+mod.bigCorner32*cv32['大角']+mod.smallCorner32*cv32['小角']+mod.bigT32*cv32['大T']+mod.smallT32*cv32['小T'];
                    fr[f] = {
                        a25:mod.area25, a32:mod.area32,
                        blk25:mod.count90_25+mod.count60_25+mod.bigCorner25+mod.smallCorner25+mod.bigT25+mod.smallT25,
                        blk32:mod.count90_32+mod.count60_32+mod.bigCorner32+mod.smallCorner32+mod.bigT32+mod.smallT32,
                        c90_25:mod.count90_25, c90_32:mod.count90_32, c60_25:mod.count60_25, c60_32:mod.count60_32,
                        b25:mod.bigCorner25, s25:mod.smallCorner25, bt25:mod.bigT25, st25:mod.smallT25,
                        b32:mod.bigCorner32, s32:mod.smallCorner32, bt32:mod.bigT32, st32:mod.smallT32,
                        i25:mod.insert25, i32:mod.insert32, mp25:mod.modulePart25, mp32:mod.modulePart32, oi25:mod.openingInsert25, oi32:mod.openingInsert32, hooks:mod.totalHooks, wC:wC, wR:wR
                    };
                    totalMod25.area += mod.area25; totalMod25.c90 += mod.count90_25; totalMod25.c60 += mod.count60_25;
                    totalMod25.big += mod.bigCorner25; totalMod25.small += mod.smallCorner25;
                    totalMod25.bT += mod.bigT25; totalMod25.sT += mod.smallT25; totalMod25.blk += fr[f].blk25;
                    totalMod32.area += mod.area32; totalMod32.c90 += mod.count90_32; totalMod32.c60 += mod.count60_32;
                    totalMod32.big += mod.bigCorner32; totalMod32.small += mod.smallCorner32;
                    totalMod32.bT += mod.bigT32; totalMod32.sT += mod.smallT32; totalMod32.blk += fr[f].blk32;
                } else {
                    fr[f] = { a25:0, a32:0, blk25:0, blk32:0, c90_25:0, c90_32:0, c60_25:0, c60_32:0, b25:0, s25:0, bt25:0, st25:0, b32:0, s32:0, bt32:0, st32:0, i25:0, i32:0, mp25:0, mp32:0, oi25:0, oi32:0, hooks:0, wC:0, wR:{ lenHoriz:0, lenVert:0, horizDia:10, vertDia:12 } };
                }
                cR = calcColumnRebar(d, cutParams);
                colC = cR.concreteVolume || 0;

                let beamStirrupCount=0, beamIndex=0;
                for (const b of beams) {
                    beamIndex++;
                    if (b.len>0 && b.wid>0 && b.hgt>0) {
                        bC += b.len*b.wid*b.hgt; bP += b.len*b.wid;
                        const s = calcSingleBeamRebar(b, cutParams);
                        const beamName=b.name||`梁${beamIndex}`;
                        if (!replaceParts.has('梁')) {
                            const mainAnchorEnds=normalizeAnchorEnds(b.mainAnchorEnds,2), secAnchorEnds=normalizeAnchorEnds(b.secAnchorEnds,2);
                            const mainAnchorD=Math.max(0,numberOr(b.mainAnchorD,12)), secAnchorD=Math.max(0,numberOr(b.secAnchorD,12));
                            addCutTon(rebarTons, addCutItem(rebarCutRows, cutParams, { floor:`${f}层`, part:'梁', component:beamName, name:`${beamName}底筋`, dia:s.mainDia, count:b.mainCount||3, baseLen:b.len, addLen:hookLen(s.mainDia, mainAnchorD, mainAnchorEnds), anchorEnds:mainAnchorEnds, anchorPerEnd:hookLen(s.mainDia,mainAnchorD,1), note:anchorNote(mainAnchorEnds) }));

                            addCutTon(rebarTons, addCutItem(rebarCutRows, cutParams, { floor:`${f}层`, part:'梁', component:beamName, name:`${beamName}箍筋`, dia:s.stirrupDia, count:s.stirrupCount, baseLen:stirrupBaseLen(b.wid||0.24, b.hgt||0.5, s.stirrupDia, b.cover??20), addLen:stirrupHookLen(s.stirrupDia, b.stirrupHookD||10, b.stirrupMinHook||75), spacing:b.stirrupSpacing||200, spacingText:s.stirrupSpacingText, note:`箍筋135°弯钩，平直段取max(${b.stirrupHookD||10}d,${b.stirrupMinHook||75}mm)` }));
                            beamStirrupCount += s.stirrupCount;
                        }
                    }
                }

                if (rArea>0) {
                    rC = rArea*(d.roofThick||0);
                    if (!(d.slabBars&&d.slabBars.length)) rR = calcRoofRebar(rArea, d.roofBottomDia||12, d.roofTopDia||10, d.roofSpacing||200);
                }

                const wr = fr[f].wR;
                const horizGroups = (wr.horizGroups && wr.horizGroups.length) ? wr.horizGroups : [{ count:wr.horizCount||0, baseLen:wr.horizBaseLen||0 }];
                if (!replaceParts.has('墙体')) horizGroups.forEach((g, idx) => {

                });

                metricHtml('钢丝勾金额', `<span class="price-value">${cH.toFixed(2)} 元</span>`),
                metricHtml('模块及建房配件合计', `<span class="price-value">${cMP.toFixed(2)} 元</span>`, 'total-line')
            ]);
            html += blockHtml('混凝土合计', [
                metricHtml('墙体混凝土', `${tWC.toFixed(2)} m³`),
                metricHtml('现浇板混凝土（全部楼层）', `${tRC.toFixed(2)} m³`),
                metricHtml('梁混凝土', `${tBC.toFixed(2)} m³`),
                metricHtml('墙内构造柱参考量', `${tCC.toFixed(2)} m³`),
                metricHtml('混凝土总量', `${tC.toFixed(2)} m³`, 'important'),
                metricHtml('混凝土金额', `<span class="price-value">${cCost.toFixed(2)} 元</span>`, 'total-line')
            ]);
            html += blockHtml('保温板与总价', [
                metricHtml('保温板金额', `<span class="price-value">${tIC.toFixed(2)} 元</span>`),
                metricHtml('钢筋金额', `<span class="price-value">${totalRebarCostAll.toFixed(2)} 元</span>`),
                metricHtml('合计总价', `<span class="price-value">${totalCost.toFixed(2)} 元</span>`, 'total-line')
            ], 'wide');

            const rebarQuickItems = [];
            rebarPurchaseSummaries.forEach(s => {
                const cost = s.purchaseWeight * pRebar;
                rebarQuickItems.push(metricHtml(`Φ${s.dia}`, `${purchaseText(s.dia, s.len, s.stock, cutParams)} · ${s.purchaseWeight.toFixed(3)} t · <span class="price-value">${cost.toFixed(2)} 元</span>`));
            });
            rebarQuickItems.push(metricHtml('箍筋总根数', `${tSC} 根`));
            rebarQuickItems.push(metricHtml('钢筋总价', `<span class="price-value">${totalRebarCostAll.toFixed(2)} 元</span>`, 'total-line'));
            html += blockHtml('钢筋费用快览', rebarQuickItems, 'wide');
            html += '</div>';
            html += `<div id="rebarPrintSection" class="rebar-print-section">${rebarListHtml}</div>`;
            $('resultContent').innerHTML = html;
        }

        function saveToLocal() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                uiMode,
                prices: { module25:priceInputs.module25.value, module32:priceInputs.module32.value, insert25:priceInputs.insert25.value, insert32:priceInputs.insert32.value, hook:priceInputs.hook.value, concrete:priceInputs.concrete.value, rebar:priceInputs.rebar.value },
                cut: { stockLen:$('cutStockLen').value, wasteRate:$('cutWasteRate').value },
                printMeta: { projectName:$('projectName') ? $('projectName').value : '', rebarWorkPart:$('rebarWorkPart') ? $('rebarWorkPart').value : '' },
                floors: floorData
            }));
        }
        function loadFromLocal() {
            const raw = localStorage.getItem(STORAGE_KEY); if (!raw) return;
            try {
                const saved = JSON.parse(raw);
                if (saved.uiMode) uiMode = saved.uiMode;
                if (saved.prices) { for (let k in saved.prices) { if (priceInputs[k]) priceInputs[k].value = saved.prices[k]; } }
                if (saved.printMeta) {
                    if ($('projectName') && saved.printMeta.projectName !== undefined) $('projectName').value = saved.printMeta.projectName;
                    if ($('rebarWorkPart') && saved.printMeta.rebarWorkPart !== undefined) $('rebarWorkPart').value = saved.printMeta.rebarWorkPart;
                }
                if (saved.cut) {
                    const ids = { stockLen:'cutStockLen', wasteRate:'cutWasteRate' };
                    for (let k in ids) { if ($(ids[k]) && saved.cut[k] !== undefined) $(ids[k]).value = saved.cut[k]; }
                }
                if (saved.floors) { for (let f of [1,2]) if (saved.floors[f]) {
                    const sf=saved.floors[f];
                    const legacy=saved.cut||{};
                    const legacyWall=numberOr(legacy.wallHookD,12);
                    const legacyMain=numberOr(legacy.mainHookD,12);
                    const legacyRoof=numberOr(legacy.roofHookD,10);
                    const legacyStirrupHook=numberOr(legacy.stirrupHookD,10);
                    const legacyStirrupMin=numberOr(legacy.stirrupMinHook,75);
                    const legacyCover=numberOr(legacy.cover,20);
                    const legacyStirrupDia=numberOr(legacy.stirrupDia,6);
                    const beams=(sf.beams||[]).map(b=>({
                        ...b,
                        cover:numberOr(b.cover,legacyCover),
                        mainAnchorD:numberOr(b.mainAnchorD,legacyMain), mainAnchorEnds:normalizeAnchorEnds(b.mainAnchorEnds,2),
                        secAnchorD:numberOr(b.secAnchorD,legacyMain), secAnchorEnds:normalizeAnchorEnds(b.secAnchorEnds,2),
                        stirrupDia:numberOr(b.stirrupDia,legacyStirrupDia), stirrupHookD:numberOr(b.stirrupHookD,legacyStirrupHook), stirrupMinHook:numberOr(b.stirrupMinHook,legacyStirrupMin)
                    }));
                    const columns=(sf.columns||[]).map(col=>({
                        ...col,
                        cover:numberOr(col.cover,legacyCover),
                        mainAnchorD:numberOr(col.mainAnchorD,legacyMain), mainAnchorEnds:normalizeAnchorEnds(col.mainAnchorEnds,2),
                        stirrupDia:numberOr(col.stirrupDia,legacyStirrupDia), stirrupHookD:numberOr(col.stirrupHookD,legacyStirrupHook), stirrupMinHook:numberOr(col.stirrupMinHook,legacyStirrupMin)
                    }));
                    floorData[f] = { ...floorData[f], ...sf, planWizard:{...PLAN_DEFAULTS[f],...(sf.planWizard||{})}, walls:sf.walls || [], beams, columns };
                    floorData[f].wallHorizAnchorD=numberOr(sf.wallHorizAnchorD,numberOr(legacy.wallHorizHookD,legacyWall));
                    floorData[f].wallHorizAnchorEnds=normalizeAnchorEnds(sf.wallHorizAnchorEnds,2);
                    floorData[f].wallVertAnchorD=numberOr(sf.wallVertAnchorD,numberOr(legacy.wallVertHookD,legacyWall));
                    floorData[f].wallVertAnchorEnds=normalizeAnchorEnds(sf.wallVertAnchorEnds,2);
                    floorData[f].roofBottomAnchorD=numberOr(sf.roofBottomAnchorD,legacyRoof);
                    floorData[f].roofBottomAnchorEnds=normalizeAnchorEnds(sf.roofBottomAnchorEnds,2);
                    floorData[f].roofTopAnchorD=numberOr(sf.roofTopAnchorD,legacyRoof);
                    floorData[f].roofTopAnchorEnds=normalizeAnchorEnds(sf.roofTopAnchorEnds,2);
                    if (sf.planWizard && sf.planWizard.enabled === undefined) floorData[f].planWizard.enabled='yes';
                    if (!sf.wallInputMode) floorData[f].wallInputMode = floorData[f].walls.length ? 'detail' : 'total';
                    if (!sf.planWizard) {
                        const p=floorData[f].planWizard;
                        p.enabled='yes';
                        p.lengthExpr=sf.roofLengthExpr||PLAN_DEFAULTS[f].lengthExpr; p.widthExpr=sf.roofWidthExpr||PLAN_DEFAULTS[f].widthExpr;
                        p.height=sf.height||PLAN_DEFAULTS[f].height; p.wallSystem=sf.mode||PLAN_DEFAULTS[f].wallSystem;
                        p.innerWallExpr=sf.mode==='mixed'?String((safeEval(String(sf.intHor||''))+safeEval(String(sf.intVer||''))).toFixed(3)):'';
                        p.innerTCount=sf.intTWalls||0; p.wallScheme=`${sf.wallVertDia||12},${sf.wallHorizDia||10}`;
                        p.slabScheme=`${sf.roofThick||0.12},${sf.roofBottomDia||12},${sf.roofTopDia||10},${sf.roofSpacing||200}`;
                        p.openingsText=(sf.openings||[]).map(op=>parseOpeningCode(op.name)?`${op.name},${op.count||1},${op.wallType||'auto'}${op.sill?`,`+op.sill+'mm':''}`:`${op.name||'洞口'},${op.width||0},${op.height||0},${op.count||1},${op.wallType||'auto'}${op.sill?`,`+op.sill+'mm':''}`).join('\n');
                    }
                } }
            } catch (e) {}
        }
        function init() {
            loadFromLocal();
            renderFloorPanel(1); renderFloorPanel(2); renderWalls(1); renderWalls(2); renderColumns(1); renderColumns(2); renderOpenings(1); renderOpenings(2); renderBeams(1); renderBeams(2); renderSlabBars(1); renderSlabBars(2); renderDetailBars(1); renderDetailBars(2);
            $('clearMaterialPrice').addEventListener('click', clearMaterialPrice);
            $('clearFloor1').addEventListener('click', () => clearFloor(1));
            $('clearFloor2').addEventListener('click', () => clearFloor(2));
            $('exportMaterialCsv').addEventListener('click', exportMaterialCsv);
            $('exportRebarCsv').addEventListener('click', exportRebarCsv);
            $('printRebarPdf').addEventListener('click', printRebarPdf);
            $('printResults').addEventListener('click', () => window.print());
            document.querySelectorAll('.floor-tab').forEach(btn => btn.addEventListener('click', function() {
                const f = this.dataset.floor;
                document.querySelectorAll('.floor-tab').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                $('floor1Panel').classList.toggle('active-panel', f==='1');
                $('floor2Panel').classList.toggle('active-panel', f==='2');
            }));
            document.querySelectorAll('input, select').forEach(el => {
                if (el.closest('.floor-panel')) return;
                el.addEventListener('input', () => { saveToLocal(); calculateAll(); });
                if (el.type === 'checkbox') el.addEventListener('change', () => { saveToLocal(); calculateAll(); });
            });
            calculateAll();
        }
        init();
    })();
</script>
</body>
</html>
