<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>模块成本价格计算器（25/32连接件分开）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-size: 16px;
        }
        .container {
            background-color: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.8rem;
            color: #2d3748;
            text-align: center;
            margin-bottom: 12px;
            font-weight: 600;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 12px;
        }
        .form-wrapper {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 0;
        }
        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 6px;
        }
        select, input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            background-color: #f8fafc;
            transition: all 0.2s;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #4285f4;
            background-color: white;
            box-shadow: 0 0 0 2px rgba(66,133,244,0.1);
        }
        .connector-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .connector-group label {
            font-size: 0.75rem;
            margin-bottom: 0;
            white-space: nowrap;
        }
        .connector-group input {
            width: 80px;
            padding: 8px;
        }
        .connector-section {
            background: #f8fafc;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 12px;
        }
        .connector-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #1e3a5f;
        }
        .calculate-btn {
            width: 100%;
            padding: 14px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 24px;
            touch-action: manipulation;
        }
        .calculate-btn:active {
            background-color: #3367d6;
            transform: scale(0.98);
        }
        .result {
            margin-top: 8px;
            padding-top: 16px;
            border-top: 2px solid #f0f4f8;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }
        .module-result {
            padding: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background-color: #f8fafc;
        }
        .module-title {
            font-size: 1rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e2e8f0;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 0.85rem;
        }
        .result-label {
            color: #718096;
        }
        .result-value {
            color: #2d3748;
            font-weight: 600;
        }
        .average-section {
            padding: 16px;
            background-color: #e8f4f8;
            border-radius: 16px;
            border: 1px solid #d1e7dd;
        }
        .average-title {
            font-size: 1rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 12px;
            text-align: center;
        }
        .highlight {
            color: #4285f4;
            font-weight: 700;
        }
        @media (max-width: 1024px) {
            .form-wrapper {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
            .results-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
        }
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            .container {
                padding: 16px;
            }
            .form-wrapper {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .results-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .module-result {
                padding: 12px;
            }
            .result-item {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>模块成本价格计算器</h1>
        
        <div class="form-wrapper">
            <div class="form-group">
                <label for="wallType">墙体类型</label>
                <select id="wallType">
                    <option value="25">25墙</option>
                    <option value="32" selected>32墙</option>
                </select>
            </div>
            <div class="form-group">
                <label for="rawMaterialCost">原料成本（元/克）</label>
                <input type="number" id="rawMaterialCost" step="0.0001" min="0" placeholder="请输入原料成本" value="0.01">
            </div>
            <div class="form-group">
                <label for="productionCost">生产成本（元/克）</label>
                <input type="number" id="productionCost" step="0.0001" min="0" placeholder="请输入生产成本" value="0.008">
            </div>
            <div class="form-group">
                <label for="moduleDensity">模块密度（千克/立方米）</label>
                <input type="number" id="moduleDensity" step="0.01" min="0" placeholder="请输入模块密度" value="25">
            </div>
        </div>

        <!-- 连接件区域：25连接件 和 32连接件分开 -->
        <div style="margin-bottom: 24px;">
            <label style="font-weight:600; font-size:1rem; margin-bottom:10px; display:block;">🔗 连接件成本</label>
            <div class="connector-section">
                <div class="connector-title">🔹 25连接件</div>
                <div class="connector-group">
                    <span style="display:flex; align-items:center; gap:4px;">
                        <label>单价 (元/个)</label>
                        <input type="number" id="conn25_unitPrice" step="0.01" min="0" value="0.59">
                    </span>
                    <span style="display:flex; align-items:center; gap:4px;">
                        <label>购入总数 (个)</label>
                        <input type="number" id="conn25_totalQty" step="1" min="0" value="10000">
                    </span>
                    <span style="display:flex; align-items:center; gap:4px;">
                        <label>运费 (元)</label>
                        <input type="number" id="conn25_shipping" step="0.01" min="0" value="200">
                    </span>
                    <span style="margin-left: auto; font-weight:600;">
                        实际单价：<span id="actualConn25Price" style="color:#4285f4;">0.00</span> 元/个
                    </span>
                </div>
            </div>
            <div class="connector-section">
                <div class="connector-title">🔸 32连接件</div>
                <div class="connector-group">
                    <span style="display:flex; align-items:center; gap:4px;">
                        <label>单价 (元/个)</label>
                        <input type="number" id="conn32_unitPrice" step="0.01" min="0" value="0.77">
                    </span>
                    <span style="display:flex; align-items:center; gap:4px;">
                        <label>购入总数 (个)</label>
                        <input type="number" id="conn32_totalQty" step="1" min="0" value="8000">
                    </span>
                    <span style="display:flex; align-items:center; gap:4px;">
                        <label>运费 (元)</label>
                        <input type="number" id="conn32_shipping" step="0.01" min="0" value="150">
                    </span>
                    <span style="margin-left: auto; font-weight:600;">
                        实际单价：<span id="actualConn32Price" style="color:#4285f4;">0.00</span> 元/个
                    </span>
                </div>
            </div>
            <div style="font-size:0.75rem; color:#718096; margin-top:4px;">
                * 实际单价 = (单价×总数 + 运费) ÷ 总数
            </div>
        </div>

        <button class="calculate-btn" id="calculateBtn">计算所有模块成本</button>

        <div class="result" id="resultArea">
            <div class="results-grid" id="modulesResults"></div>
            <div class="average-section" id="averageResults"></div>
        </div>
    </div>

    <script>
        // 模块配置：连接件数量拆分为 conn25 和 conn32
        const moduleConfig25 = {
            "90直板": { conn25: 6, conn32: 0, area: 0.27, volume: 0.027870261 },
            "60直板": { conn25: 4, conn32: 0, area: 0.18, volume: 0.018595375 },
            "大角":   { conn25: 8, conn32: 0, area: 0.36, volume: 0.037638275 },
            "小角":   { conn25: 4, conn32: 0, area: 0.18, volume: 0.019092729 },
            "大T":    { conn25: 10, conn32: 0, area: 0.4125, volume: 0.040589877 },
            "小T":    { conn25: 8, conn32: 0, area: 0.3225, volume: 0.031314649 }
        };

        const moduleConfig32 = {
            "90直板": { conn25: 0, conn32: 6, area: 0.27, volume: 0.027942198 },
            "60直板": { conn25: 0, conn32: 4, area: 0.18, volume: 0.018646211 },
            "大角":   { conn25: 0, conn32: 8, area: 0.456, volume: 0.037745287 },
            "小角":   { conn25: 0, conn32: 4, area: 0.276, volume: 0.0191619 },
            "大T":    { conn25: 2, conn32: 8, area: 0.402, volume: 0.039743652 },
            "小T":    { conn25: 4, conn32: 4, area: 0.312, volume: 0.03043443 }
        };

        const STORAGE_KEY = 'moduleCostCalculatorV4_splitConn';

        const wallTypeSelect = document.getElementById('wallType');
        const rawMaterialCostInput = document.getElementById('rawMaterialCost');
        const productionCostInput = document.getElementById('productionCost');
        const moduleDensityInput = document.getElementById('moduleDensity');

        // 25连接件元素
        const conn25_unitPrice = document.getElementById('conn25_unitPrice');
        const conn25_totalQty = document.getElementById('conn25_totalQty');
        const conn25_shipping = document.getElementById('conn25_shipping');
        const actualConn25PriceSpan = document.getElementById('actualConn25Price');

        // 32连接件元素
        const conn32_unitPrice = document.getElementById('conn32_unitPrice');
        const conn32_totalQty = document.getElementById('conn32_totalQty');
        const conn32_shipping = document.getElementById('conn32_shipping');
        const actualConn32PriceSpan = document.getElementById('actualConn32Price');

        // 更新实际单价显示
        function updateActualPrices() {
            // 25连接件
            const u25 = parseFloat(conn25_unitPrice.value) || 0;
            const t25 = parseInt(conn25_totalQty.value) || 0;
            const s25 = parseFloat(conn25_shipping.value) || 0;
            let actual25 = 0;
            if (t25 > 0) actual25 = (u25 * t25 + s25) / t25;
            actualConn25PriceSpan.textContent = actual25.toFixed(4);

            // 32连接件
            const u32 = parseFloat(conn32_unitPrice.value) || 0;
            const t32 = parseInt(conn32_totalQty.value) || 0;
            const s32 = parseFloat(conn32_shipping.value) || 0;
            let actual32 = 0;
            if (t32 > 0) actual32 = (u32 * t32 + s32) / t32;
            actualConn32PriceSpan.textContent = actual32.toFixed(4);
        }

        function getActualConnectorPrices() {
            const u25 = parseFloat(conn25_unitPrice.value) || 0;
            const t25 = parseInt(conn25_totalQty.value) || 0;
            const s25 = parseFloat(conn25_shipping.value) || 0;
            const actual25 = t25 > 0 ? (u25 * t25 + s25) / t25 : 0;

            const u32 = parseFloat(conn32_unitPrice.value) || 0;
            const t32 = parseInt(conn32_totalQty.value) || 0;
            const s32 = parseFloat(conn32_shipping.value) || 0;
            const actual32 = t32 > 0 ? (u32 * t32 + s32) / t32 : 0;

            return { actual25, actual32 };
        }

        // 事件绑定
        [conn25_unitPrice, conn25_totalQty, conn25_shipping, conn32_unitPrice, conn32_totalQty, conn32_shipping].forEach(el => {
            el.addEventListener('input', updateActualPrices);
        });

        // 数据保存
        function saveInputValues() {
            const data = {
                wallType: wallTypeSelect.value,
                rawMaterialCost: rawMaterialCostInput.value,
                productionCost: productionCostInput.value,
                moduleDensity: moduleDensityInput.value,
                conn25: {
                    unitPrice: conn25_unitPrice.value,
                    totalQty: conn25_totalQty.value,
                    shipping: conn25_shipping.value
                },
                conn32: {
                    unitPrice: conn32_unitPrice.value,
                    totalQty: conn32_totalQty.value,
                    shipping: conn32_shipping.value
                }
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function loadInputValues() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    wallTypeSelect.value = data.wallType || "32";
                    rawMaterialCostInput.value = data.rawMaterialCost || 0.01;
                    productionCostInput.value = data.productionCost || 0.008;
                    moduleDensityInput.value = data.moduleDensity || 25;
                    if (data.conn25) {
                        conn25_unitPrice.value = data.conn25.unitPrice || 0.59;
                        conn25_totalQty.value = data.conn25.totalQty || 10000;
                        conn25_shipping.value = data.conn25.shipping || 200;
                    }
                    if (data.conn32) {
                        conn32_unitPrice.value = data.conn32.unitPrice || 0.77;
                        conn32_totalQty.value = data.conn32.totalQty || 8000;
                        conn32_shipping.value = data.conn32.shipping || 150;
                    }
                    updateActualPrices();
                } catch (e) {
                    console.warn("读取保存数据失败");
                }
            }
        }

        function getModuleConfig() {
            return wallTypeSelect.value === "25" ? moduleConfig25 : moduleConfig32;
        }

        function calculateAllCost() {
            const rawMaterialCost = parseFloat(rawMaterialCostInput.value) || 0;
            const productionCost = parseFloat(productionCostInput.value) || 0;
            const moduleDensity = parseFloat(moduleDensityInput.value) || 0;
            const { actual25, actual32 } = getActualConnectorPrices();

            if (rawMaterialCost <= 0) { alert("原料成本需大于0"); return; }
            if (moduleDensity <= 0) { alert("模块密度需大于0"); return; }
            if (productionCost < 0) { alert("生产成本不能为负数"); return; }

            saveInputValues();

            const moduleConfig = getModuleConfig();
            const allResults = [];
            let totalCostSum = 0;
            let pricePerSquareSum = 0;

            for (const [moduleType, config] of Object.entries(moduleConfig)) {
                const totalWeight = config.volume * moduleDensity * 1000;
                const totalRawMaterialCost = totalWeight * rawMaterialCost;
                const totalProductionCost = totalWeight * productionCost;
                const totalConnectorCost = config.conn25 * actual25 + config.conn32 * actual32;
                const totalCost = totalRawMaterialCost + totalProductionCost + totalConnectorCost;
                const pricePerSquare = totalCost / config.area;

                allResults.push({
                    moduleType,
                    totalWeight,
                    totalRawMaterialCost,
                    totalProductionCost,
                    conn25Count: config.conn25,
                    conn32Count: config.conn32,
                    totalConnectorCost,
                    totalCost,
                    pricePerSquare
                });

                totalCostSum += totalCost;
                pricePerSquareSum += pricePerSquare;
            }

            const moduleCount = Object.keys(moduleConfig).length;
            const averageTotalCost = totalCostSum / moduleCount;
            const averagePricePerSquare = pricePerSquareSum / moduleCount;

            renderResults(allResults, averageTotalCost, averagePricePerSquare, actual25, actual32);
        }

        function renderResults(results, avgTotalCost, avgPricePerSquare, actual25, actual32) {
            const modulesResults = document.getElementById('modulesResults');
            const averageResults = document.getElementById('averageResults');
            
            let modulesHtml = "";
            results.forEach(item => {
                modulesHtml += `
                <div class="module-result">
                    <div class="module-title">${item.moduleType}</div>
                    <div class="result-item">
                        <span class="result-label">总质量：</span>
                        <span class="result-value">${item.totalWeight.toFixed(4)} 克</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">原料成本：</span>
                        <span class="result-value">${item.totalRawMaterialCost.toFixed(2)} 元</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">生产成本：</span>
                        <span class="result-value">${item.totalProductionCost.toFixed(2)} 元</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">连接件成本：</span>
                        <span class="result-value">${item.totalConnectorCost.toFixed(2)} 元</span>
                    </div>
                    <div style="font-size:0.7rem; color:#718096; padding-left: 6px;">
                        　25连接件：${item.conn25Count}个 (单价${actual25.toFixed(4)}) | 32连接件：${item.conn32Count}个 (单价${actual32.toFixed(4)})
                    </div>
                    <div class="result-item">
                        <span class="result-label">总成本：</span>
                        <span class="result-value highlight">${item.totalCost.toFixed(2)} 元</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">每平价格：</span>
                        <span class="result-value highlight">${item.pricePerSquare.toFixed(2)} 元/㎡</span>
                    </div>
                </div>
                `;
            });

            let averageHtml = `
            <div class="average-title">所有模块平均值</div>
            <div class="result-item">
                <span class="result-label">总成本平均值：</span>
                <span class="result-value highlight">${avgTotalCost.toFixed(2)} 元</span>
            </div>
            <div class="result-item">
                <span class="result-label">每平价格平均值：</span>
                <span class="result-value highlight">${avgPricePerSquare.toFixed(2)} 元/㎡</span>
            </div>
            `;

            modulesResults.innerHTML = modulesHtml;
            averageResults.innerHTML = averageHtml;
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadInputValues();
            updateActualPrices();
            document.getElementById('calculateBtn').addEventListener('click', calculateAllCost);
            calculateAllCost();
        });
    </script>
</body>
</html>
